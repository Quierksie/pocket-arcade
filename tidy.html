<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tidy Time</title>
<meta name="theme-color" content="#eef1f8">
<script>try { var t = (JSON.parse(localStorage.getItem('pocketArcade.tidy.v1') || '{}').theme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = t; if (t === 'dark') document.querySelector('meta[name=theme-color]').content = '#1d1829'; } catch (e) { }</script>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: cozy one-screen puzzle. Level grid on the menu; in play, a fixed 360x600 board scaled to fit, with a slim top bar. Single soft pastel theme. */
:root {
  --bg: #eef1f8;
  --card: #ffffff;
  --ink: #4a3b52;
  --soft: #8d7f96;
  --pink: #ff8fab;
  --mint: #7fd8be;
  --sun: #ffd166;
  --display: 'Fredoka', 'Nunito', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --outline: #4a3b52;
  --track: #dfe4f0;
  --shadow: #d6dbe8;
  --locked: #e3e7f1;
  --locked-ink: #a9b0c2;
  --star-off: #d9dde8;
  --table: #f7e3cf;
  --table-edge: #ecd0b4;
  --table-side: #d9b48f;
  --tray: #e3e7f1;
  --alt: #e9edf6;
  --alt-edge: #d0d6e4;
  --scrim: rgba(74,59,82,.35);
  --room-dim: none;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1d1829;
  --card: #2b2440;
  --ink: #f3eaf8;
  --soft: #b2a5c6;
  --track: #15111f;
  --shadow: #120e1b;
  --locked: #241e35;
  --locked-ink: #675d80;
  --star-off: #463d5e;
  --table: #4a3d4a;
  --table-edge: #3a2f3b;
  --table-side: #2c232d;
  --tray: #262036;
  --alt: #3a3252;
  --alt-edge: #211b31;
  --scrim: rgba(8,5,14,.6);
  --room-dim: brightness(.72) saturate(.85);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

/* ---------- menu ---------- */
#menu { flex: 1; overflow-y: auto; padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; justify-content: space-between; align-items: center; }
.themebtn { display: flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 7px 12px 7px 9px; background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--shadow); font-weight: 800; font-size: 13px; }
.themebtn svg { width: 18px; height: 18px; }
.top a { color: var(--soft); font-weight: 700; font-size: 14px; text-decoration: none; }
.logo { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1; margin: 0; color: var(--ink); letter-spacing: .5px; }
.logo span { color: var(--pink); }
.tag { margin: 6px 0 0; color: var(--soft); font-size: 15px; line-height: 1.45; max-width: 36ch; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--track); padding: 5px; border-radius: 16px; }
.modes button { border: 0; background: none; padding: 10px; border-radius: 12px; font-family: var(--display); font-weight: 600; font-size: 16px; color: var(--soft); }
.modes button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--shadow); }
.modehint { margin: -6px 2px 0; font-size: 13px; color: var(--soft); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.lv { position: relative; aspect-ratio: 1 / 1.05; border: 0; border-radius: 20px; background: var(--card); box-shadow: 0 4px 0 var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; }
.lv:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--shadow); }
.lv .n { font-family: var(--display); font-weight: 700; font-size: 26px; }
.lv .ty { font-size: 11px; font-weight: 800; color: var(--soft); text-transform: uppercase; letter-spacing: .4px; }
.lv svg.ic { width: 30px; height: 30px; }
.stars { font-size: 14px; letter-spacing: 1px; color: #e0c27a; }
.stars .off { color: var(--star-off); }
.lv.locked { background: var(--locked); box-shadow: none; color: var(--locked-ink); }
.lv.locked .lock { width: 26px; height: 26px; }
.lv.next { outline: 3px solid var(--pink); outline-offset: -3px; }

/* ---------- play ---------- */
#play { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
.iconbtn { width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--shadow); display: grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; }
.ttl { flex: 1; min-width: 0; }
.ttl b { display: block; font-family: var(--display); font-weight: 600; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttl small { display: block; color: var(--soft); font-size: 13px; font-weight: 700; }
.timer { height: 8px; margin: 0 12px; border-radius: 4px; background: var(--track); overflow: hidden; }
.timer div { height: 100%; width: 100%; background: linear-gradient(90deg, var(--mint), #5cc7a8); transition: width .2s linear; }
.timer.low div { background: linear-gradient(90deg, #ff9f9f, var(--pink)); }
.wrap { flex: 1; min-height: 0; position: relative; }
.board { position: absolute; left: 50%; top: 0; width: 360px; height: 600px; transform-origin: top center; touch-action: none; }

/* pieces on the board */
.it { position: absolute; touch-action: none; cursor: grab; transition: transform .18s ease, opacity .25s; will-change: left, top, transform; }
.it svg { width: 100%; height: 100%; display: block; overflow: visible; }
.it.drag { cursor: grabbing; z-index: 250 !important; transition: transform .1s; filter: drop-shadow(0 16px 10px rgba(40,25,50,.3)); }
.it.item { filter: drop-shadow(0 5px 3px rgba(40,25,50,.24)); }
.it.warm { filter: drop-shadow(0 0 6px rgba(255,209,102,.95)) drop-shadow(0 0 14px rgba(255,209,102,.7)) !important; }
.it.done { cursor: default; }
.it.shake { animation: shake .35s; }
@keyframes shake { 0%, 100% { translate: 0 0; } 25% { translate: -7px 0; } 75% { translate: 7px 0; } }
.pop { animation: popin .3s cubic-bezier(.3,1.6,.5,1); }
@keyframes popin { from { transform: scale(.6); } to { transform: scale(1); } }

.table { position: absolute; border-radius: 26px; background: radial-gradient(120% 80% at 30% 15%, rgba(255,255,255,.35), transparent 60%), var(--table); box-shadow: inset 0 3px 0 rgba(255,255,255,.45), inset 0 -6px 0 var(--table-edge), 0 12px 0 var(--table-side), 0 22px 22px rgba(40,25,50,.18); }
.bin { position: absolute; border-radius: 22px 22px 28px 28px; border: 3px solid var(--outline); color: var(--outline); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 8px; transition: transform .15s; }
.bin { box-shadow: inset 0 -12px 0 rgba(0,0,0,.07), inset 0 4px 0 rgba(255,255,255,.5), 0 7px 0 var(--outline), 0 14px 16px rgba(40,25,50,.2); }
.bin::before { content: ''; position: absolute; left: 9px; right: 9px; top: 9px; height: 30px; border-radius: 14px 14px 10px 10px; background: rgba(74,59,82,.2); box-shadow: inset 0 8px 8px rgba(40,25,50,.25); }
.bin .lbl { font-family: var(--display); font-weight: 600; font-size: 14px; background: rgba(255,255,255,.85); border-radius: 10px; padding: 2px 8px; }
.bin .cnt { font-size: 12px; font-weight: 800; color: var(--outline); opacity: .7; margin-top: 2px; }
.bin svg { width: 34px; height: 34px; margin-bottom: 2px; }
.bin.ok { transform: scale(1.06); }
.bin.bad { animation: shake .35s; border-color: #e0566f; }

.box { position: absolute; border-radius: 10px; background: #d9ab80; border: 3px solid var(--outline); box-shadow: inset 0 12px 0 #b98552, inset 10px 0 0 #c99a6e, inset -10px 0 0 #c99a6e, inset 0 -6px 0 #e8c39e, 0 10px 0 #a8774c, 0 10px 0 3px var(--outline), 0 22px 22px rgba(40,25,50,.22); }
.box::before, .box::after { content: ''; position: absolute; top: 10px; bottom: 10px; width: 22px; background: #e8c39e; border: 3px solid var(--outline); z-index: -1; }
.box::before { left: -24px; border-radius: 8px 2px 2px 8px; transform: skewY(-8deg); }
.box::after { right: -24px; border-radius: 2px 8px 8px 2px; transform: skewY(8deg); }
.cell { position: absolute; border-radius: 6px; background: rgba(255,240,220,.4); box-shadow: inset 0 4px 5px rgba(90,55,30,.28), 0 1px 0 rgba(255,255,255,.4); }
.tray { position: absolute; border-radius: 22px; background: var(--tray); box-shadow: inset 0 6px 12px rgba(40,25,50,.1), inset 0 -2px 0 rgba(255,255,255,.4); }

.room { position: absolute; overflow: visible; }
.room > svg:first-child { filter: var(--room-dim); transition: filter .3s; }
.spot { position: absolute; border: 3px dashed var(--pink); border-radius: 14px; background: rgba(255,143,171,.12); opacity: 0; transition: opacity .2s; pointer-events: none; animation: glowspot 1s infinite alternate; }
.spot.show { opacity: 1; }
@keyframes glowspot { from { box-shadow: 0 0 0 0 rgba(255,143,171,.0); } to { box-shadow: 0 0 18px 4px rgba(255,143,171,.55); } }
.mbox { position: absolute; border: 0; background: none; padding: 0; }
.mbox svg { width: 100%; height: 100%; overflow: visible; }
.mbox .flapL, .mbox .flapR { transition: transform .35s cubic-bezier(.3,1.5,.5,1); }
.mbox.open .flapL { transform: rotate(-38deg); }
.mbox.open .flapR { transform: rotate(38deg); }
.note { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; color: var(--soft); font-size: 14px; pointer-events: none; }

.spark { position: absolute; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; animation: spark .7s ease-out forwards; z-index: 60; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

/* ---------- win / lose ---------- */
.overlay { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
.card { width: 100%; max-width: 330px; background: var(--card); border-radius: 28px; padding: 24px 20px 18px; text-align: center; box-shadow: 0 8px 0 var(--shadow); animation: popin .35s cubic-bezier(.3,1.6,.5,1); }
.card h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 34px; color: var(--pink); }
.card p { margin: 8px 0 0; color: var(--soft); font-weight: 700; line-height: 1.4; }
.bigstars { font-size: 42px; letter-spacing: 6px; margin-top: 8px; color: #f2b84b; }
.bigstars .off { color: var(--star-off); }
.btns { display: grid; gap: 8px; margin-top: 16px; }
.btn { border: 0; border-radius: 16px; padding: 13px; font-family: var(--display); font-weight: 600; font-size: 18px; background: var(--pink); color: #fff; box-shadow: 0 4px 0 #e06c8b; }
.btn.alt { background: var(--alt); color: var(--ink); box-shadow: 0 4px 0 var(--alt-edge); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #e06c8b; }
.confetti { position: fixed; top: -10px; width: 9px; height: 14px; border-radius: 3px; z-index: 99; pointer-events: none; animation: fall 1.8s ease-in forwards; }
@keyframes fall { to { transform: translate(var(--dx), 105vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) { .confetti, .spark { display: none; } .spot { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <main id="menu">
    <div class="top"><a href="./">‹ Pocket Arcade</a><button type="button" class="themebtn" id="themeBtn" aria-pressed="false"></button></div>
    <div>
      <h1 class="logo">Tidy <span>Time</span></h1>
      <p class="tag">Pack boxes, sort things where they belong and set up cozy rooms. No rush, no ads.</p>
    </div>
    <div class="modes" role="group" aria-label="Mode">
      <button type="button" id="mRelax" aria-pressed="true">Relaxed</button>
      <button type="button" id="mTimed" aria-pressed="false">Timed</button>
    </div>
    <p class="modehint" id="modeHint">No clock. Fewer mistakes means more stars.</p>
    <div class="grid" id="levels"></div>
  </main>

  <section id="play" hidden>
    <div class="bar">
      <button type="button" class="iconbtn" id="backBtn" aria-label="Back to levels"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="ttl"><b id="lvTitle">Level</b><small id="lvSub"></small></div>
      <button type="button" class="iconbtn" id="restartBtn" aria-label="Restart level"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M4 4v5h5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="timer" id="timer" hidden><div id="timerFill"></div></div>
    <div class="wrap" id="wrap"><div class="board" id="board"></div></div>
  </section>
</div>
<div class="overlay" id="over" hidden><div class="card"><h2 id="oTitle">Spotless!</h2><div class="bigstars" id="oStars"></div><p id="oText"></p><div class="btns" id="oBtns"></div></div></div>

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const OL = '#5b4a63';
const S = `stroke="${OL}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;

// ---------- art: small items (viewBox 0 0 100 100) ----------
const ITEMS = {
  pencil: c => `<g transform="rotate(-35 50 50)"><rect x="16" y="40" width="60" height="20" rx="5" fill="${c}" ${S}/><rect x="20" y="44" width="52" height="4" rx="2" fill="#fff" opacity=".45"/><path d="M76 40 L94 50 L76 60 Z" fill="#f6d7a7" ${S}/><path d="M88 47 L94 50 L88 53 Z" fill="${OL}"/><rect x="8" y="40" width="12" height="20" rx="4" fill="#f4a3b4" ${S}/></g>`,
  book: c => `<rect x="22" y="12" width="58" height="76" rx="7" fill="${c}" ${S}/><rect x="22" y="12" width="13" height="76" rx="5" fill="#000" opacity=".12"/><rect x="44" y="28" width="26" height="7" rx="3.5" fill="#fff" opacity=".75"/><rect x="44" y="40" width="18" height="5" rx="2.5" fill="#fff" opacity=".55"/>`,
  apple: () => `<path d="M50 30 C30 18 14 36 20 58 C26 80 40 88 50 82 C60 88 74 80 80 58 C86 36 70 18 50 30 Z" fill="#ff6b6b" ${S}/><path d="M50 30 Q52 18 58 12" fill="none" ${S}/><path d="M56 22 Q70 12 76 22 Q66 30 56 22 Z" fill="#7fd8be" ${S}/><ellipse cx="34" cy="46" rx="6" ry="10" fill="#fff" opacity=".5"/>`,
  banana: () => `<path d="M30 20 C14 46 22 80 58 88 C72 91 84 86 91 78 C87 74 82 73 77 74 C56 77 40 62 42 24 Z" fill="#ffd95e" ${S}/><path d="M30 20 C14 46 22 80 58 88 C72 91 84 86 91 78 C87 74 82 73 77 74 C56 77 40 62 42 24 Z" fill="none" ${S}/><path d="M37 30 C33 52 42 70 62 78" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/><path d="M29 22 L32 9 L41 11 L42 24 Z" fill="#ffd95e" ${S}/><rect x="31" y="6" width="11" height="6" rx="2" fill="#8a6a52" ${S}/><circle cx="90" cy="78" r="3.5" fill="${OL}"/>`,
  grapes: () => `${[[50, 34], [38, 46], [62, 46], [44, 58], [56, 58], [50, 70], [32, 34], [68, 34]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="11" fill="#b58df2" ${S}/>`).join('')}<path d="M50 24 L52 10" ${S}/><path d="M52 14 Q64 6 70 14 Q60 22 52 14 Z" fill="#7fd8be" ${S}/>`,
  orange: () => `<circle cx="50" cy="54" r="32" fill="#ffa95e" ${S}/><path d="M50 22 Q60 10 70 16 Q62 26 50 22 Z" fill="#7fd8be" ${S}/><circle cx="38" cy="44" r="6" fill="#fff" opacity=".45"/>`,
  carrot: () => `<path d="M30 30 L70 34 L44 92 Z" fill="#ff9f43" ${S}/><path d="M40 46 L52 46 M38 60 L50 60 M44 74 L50 74" ${S}/><path d="M48 32 Q40 10 30 12 M52 32 Q56 8 66 10 M56 33 Q74 18 80 26" fill="none" stroke="#5cc7a8" stroke-width="6" stroke-linecap="round"/>`,
  broccoli: () => `<path d="M42 56 L40 90 L60 90 L58 56 Z" fill="#a8e6a1" ${S}/>${[[34, 44], [50, 34], [66, 44], [50, 52], [40, 30], [62, 30]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="15" fill="#5cc78a" ${S}/>`).join('')}`,
  eggplant: () => `<path d="M58 30 C84 40 80 84 52 88 C26 92 20 64 36 52 C46 44 44 34 58 30 Z" fill="#9b6dd6" ${S}/><path d="M50 30 Q60 18 72 26 Q64 36 50 30 Z" fill="#7fd8be" ${S}/><path d="M60 24 L62 12" ${S}/><ellipse cx="44" cy="66" rx="5" ry="10" fill="#fff" opacity=".35" transform="rotate(30 44 66)"/>`,
  bread: () => `<path d="M14 54 C14 30 86 30 86 54 L82 82 L18 82 Z" fill="#e9b56f" ${S}/><path d="M36 46 L44 40 M50 46 L58 40 M64 46 L72 40" ${S}/>`,
  croissant: () => `<path d="M12 64 C22 30 78 30 88 64 C80 70 72 64 70 58 C62 66 38 66 30 58 C28 64 20 70 12 64 Z" fill="#f2b765" ${S}/><path d="M38 44 L42 60 M50 40 L50 60 M62 44 L58 60" ${S}/>`,
  donut: () => `<circle cx="50" cy="52" r="34" fill="#f2c18d" ${S}/><path d="M18 50 C18 26 82 26 82 50 C84 60 74 60 70 56 C64 64 58 56 50 60 C42 56 36 64 30 56 C24 60 16 60 18 50 Z" fill="#ff9fc0" ${S}/><circle cx="50" cy="52" r="10" fill="#fff" ${S}/><path d="M34 40 l4 3 M60 36 l5 1 M66 46 l2 5 M40 32 l5 -1" stroke="#7fd8be" stroke-width="4" stroke-linecap="round"/>`,
  ball: () => `<circle cx="50" cy="52" r="34" fill="#ff8fab" ${S}/><path d="M18 46 Q50 60 82 46" fill="none" ${S}/><path d="M50 18 Q36 52 50 86" fill="none" ${S}/>`,
  duck: () => `<path d="M24 60 C24 44 40 44 46 48 C44 30 60 22 70 34 C76 40 74 50 68 54 C80 54 84 66 76 76 C64 90 30 88 24 60 Z" fill="#ffd166" ${S}/><path d="M72 38 L88 42 L72 46 Z" fill="#ff9f43" ${S}/><circle cx="62" cy="36" r="3" fill="${OL}"/>`,
  blocks: () => `<rect x="20" y="40" width="40" height="40" rx="6" fill="#7fc8f8" ${S}/><rect x="44" y="20" width="36" height="36" rx="6" fill="#ffd166" ${S}/><text x="40" y="69" font-family="Fredoka, sans-serif" font-weight="700" font-size="24" text-anchor="middle" fill="${OL}">A</text><text x="62" y="46" font-family="Fredoka, sans-serif" font-weight="700" font-size="22" text-anchor="middle" fill="${OL}">B</text>`,
  shirt: c => `<path d="M30 18 L42 14 Q50 24 58 14 L70 18 L88 34 L76 46 L70 40 L70 86 L30 86 L30 40 L24 46 L12 34 Z" fill="${c}" ${S}/>`,
  sock: c => `<path d="M34 10 L60 10 L60 58 Q60 70 72 72 L80 74 Q90 78 86 88 Q82 94 70 92 L40 86 Q30 84 32 70 Z" fill="${c}" ${S}/><rect x="34" y="10" width="26" height="12" fill="#fff" opacity=".6"/>`,
  hat: c => `<path d="M20 70 C20 30 80 30 80 70 Z" fill="${c}" ${S}/><path d="M12 70 L88 70 Q88 80 78 80 L22 80 Q12 80 12 70 Z" fill="${c}" ${S}/><circle cx="50" cy="28" r="7" fill="#fff" ${S}/>`,
  mug: c => `<rect x="20" y="28" width="48" height="54" rx="8" fill="${c}" ${S}/><path d="M68 40 Q86 40 84 56 Q82 70 68 68" fill="none" ${S}/><path d="M34 20 Q38 12 34 6 M48 20 Q52 12 48 6" fill="none" stroke="${OL}" stroke-width="3" stroke-linecap="round" opacity=".5"/>`,
  gift: c => `<rect x="18" y="38" width="64" height="48" rx="6" fill="${c}" ${S}/><rect x="14" y="28" width="72" height="16" rx="5" fill="${c}" ${S}/><rect x="44" y="28" width="12" height="58" fill="#fff" opacity=".7"/><path d="M50 28 Q34 8 30 22 Q32 30 50 28 Q66 8 70 22 Q68 30 50 28 Z" fill="#fff" ${S}/>`,
};
const svgWrap = (inner, vb = '0 0 100 100') => `<svg viewBox="${vb}" aria-hidden="true">${inner}</svg>`;

// ---------- art: furniture (each has its own size in room units) ----------
const WOOD = '#d9a273', WOODD = '#b57d52';

const pth = (pts, fill, line = true) => `<path d="M${pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L')} Z" fill="${fill}"${line ? ` stroke="${OL}" stroke-width="2.2" stroke-linejoin="round"` : ''}/>`;

function isoSVG(name, o) {

  const mp = ([x, y, z]) => { if (flip) y = F.D - y; return swap ? [y, x, z] : [x, y, z]; };

      let [, x, y, z, w, d, h, c] = pt;
      if (flip) y = F.D - y - d;
      if (swap) [x, y, w, d] = [y, x, d, w];
      out += isoBox(x, y, z, w, d, h, c);
    } else if (pt[0] === 'q') {
      out += pth(pt[1].map(mp).map(q => lp(...q)), pt[2], pt[3] !== false);
    } else {
      const [x, y, z] = mp([pt[1], pt[2], pt[3]]), [cx, cy] = lp(x, y, z);
      out += `<ellipse cx="${cx}" cy="${cy}" rx="${pt[4]}" ry="${pt[5]}" fill="${pt[6]}" stroke="${OL}" stroke-width="2.2" transform="rotate(${swap ? -pt[7] : pt[7]} ${cx} ${cy})"/>`;

  return { fw, fd, pad, w, h, svg: `<svg viewBox="${-fd - pad} ${-F.H - pad} ${w} ${h}" aria-hidden="true">${out}</svg>` };

  board.innerHTML = ''; fit();
  $('lvTitle').textContent = `${i + 1}. ${lv.name}`;
  const count = lv.type === 'sort' ? playSort(lv) : lv.type === 'pack' ? playPack(lv) : playRoom(lv);
  const timed = SV.mode === 'timed';
  $('timer').hidden = !timed;
  if (timed) {
    game.limit = Math.round((lv.type === 'sort' ? 3.2 : lv.type === 'pack' ? 7 : 7.5) * count + 12);
    game.start = performance.now();
    const tick = () => {
      const left = Math.max(0, game.limit - (performance.now() - game.start) / 1000), f = left / game.limit;
      $('timerFill').style.width = (f * 100) + '%'; $('timer').classList.toggle('low', f < .25);

}
function starsFor() {
  if (SV.mode === 'timed') { const f = 1 - (performance.now() - game.start) / 1000 / game.limit; return f > .5 ? 3 : f > .25 ? 2 : 1; }
  return game.mistakes <= 1 ? 3 : game.mistakes <= 3 ? 2 : 1;
}
const starHTML = (n, max = 3) => rep(max, k => `<span class="${k < n ? '' : 'off'}">★</span>`).join('');
function win() {
  if (game.over) return; game.over = true; clearInterval(game.timerId);
  const st = starsFor(), b = SV.best[game.i] = SV.best[game.i] || {}; b[SV.mode] = Math.max(b[SV.mode] || 0, st); saveSV();
  setTimeout(() => {
    sfx.win(); confetti();
    const last = game.i >= L.length - 1;
    showOver(['Spotless!', 'Neat!', 'So tidy!', 'Perfect!'][Math.floor(Math.random() * 4)], st,
      SV.mode === 'timed' ? `Finished with ${Math.round(game.limit - (performance.now() - game.start) / 1000)}s to spare.` : game.mistakes ? `${game.mistakes} oops. Fewer slips earn more stars.` : 'Not a single slip!',
      [[last ? 'Back to levels' : 'Next level', () => last ? toMenu() : startLevel(game.i + 1)], ['Play again', () => startLevel(game.i), true], ...(last ? [] : [['Levels', toMenu, true]])]);
  }, 450);
}
function lose() {
  game.over = true; clearInterval(game.timerId); sfx.wrong();
  showOver('Time’s up!', 0, 'So close. Try again, or switch to Relaxed mode for no clock.', [['Try again', () => startLevel(game.i)], ['Levels', toMenu, true]]);
}
function showOver(title, st, text, btns) {
  $('oTitle').textContent = title; $('oStars').innerHTML = st ? starHTML(st) : ''; $('oStars').hidden = !st; $('oText').textContent = text;
  const box = $('oBtns'); box.innerHTML = '';
  btns.forEach(([label, fn, alt]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (alt ? ' alt' : ''); b.textContent = label; b.onclick = () => { $('over').hidden = true; fn(); }; box.append(b); });
  $('over').hidden = false; box.firstChild.focus();
}
function confetti() {
  const cols = ['#ff8fab', '#ffd166', '#7fd8be', '#7fc8f8', '#b58df2'];
  for (let i = 0; i < 40; i++) { const c = document.createElement('div'); c.className = 'confetti'; c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % 5]; c.style.animationDelay = Math.random() * .4 + 's'; c.style.setProperty('--dx', (Math.random() - .5) * 120 + 'px'); document.body.append(c); setTimeout(() => c.remove(), 2400); }
}
function toMenu() { clearInterval(game.timerId); game.over = true; $('play').hidden = true; $('menu').hidden = false; renderMenu(); }
function renderMenu() {
  $('mRelax').setAttribute('aria-pressed', SV.mode === 'relaxed'); $('mTimed').setAttribute('aria-pressed', SV.mode === 'timed');
  $('modeHint').textContent = SV.mode === 'timed' ? 'Beat the clock. Finish faster for more stars.' : 'No clock. Fewer mistakes means more stars.';
  const g = $('levels'); g.innerHTML = '';
  const firstOpen = L.findIndex((_, i) => unlocked(i) && !cleared(i));
  L.forEach((lv, i) => {
    const b = document.createElement('button'); b.type = 'button'; const open = unlocked(i), st = bestOf(i)[SV.mode] || 0;
    b.className = 'lv' + (open ? '' : ' locked') + (i === firstOpen ? ' next' : '');
    b.innerHTML = open ? `<svg class="ic" viewBox="0 0 100 100">${TYPE_ICON[lv.type]}</svg><span class="n">${i + 1}</span><span class="ty">${TYPE_LABEL[lv.type]}</span><span class="stars">${starHTML(st)}</span>`
      : `<svg class="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="3" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.5"/></svg><span class="ty">Level ${i + 1}</span>`;
    b.setAttribute('aria-label', open ? `Level ${i + 1}, ${lv.name}, ${TYPE_LABEL[lv.type]}, ${st} stars` : `Level ${i + 1}, locked`);
    b.disabled = !open; b.onclick = () => { ac(); startLevel(i); };
    g.append(b);
  });
}
$('mRelax').onclick = () => { SV.mode = 'relaxed'; saveSV(); renderMenu(); };
$('mTimed').onclick = () => { SV.mode = 'timed'; saveSV(); renderMenu(); };
$('backBtn').onclick = toMenu;
$('restartBtn').onclick = () => startLevel(game.i);
renderMenu();
window.__tidy = { L, game, startLevel, SV };
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tidy Time</title>
<meta name="theme-color" content="#eef1f8">
<script>try { var t = (JSON.parse(localStorage.getItem('pocketArcade.tidy.v1') || '{}').theme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = t; if (t === 'dark') document.querySelector('meta[name=theme-color]').content = '#1d1829'; } catch (e) { }</script>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: cozy one-screen puzzle. Level grid on the menu; in play, a fixed 360x600 board scaled to fit, with a slim top bar. Single soft pastel theme. */
:root {
  --bg: #eef1f8;
  --card: #ffffff;
  --ink: #4a3b52;
  --soft: #8d7f96;
  --pink: #ff8fab;
  --mint: #7fd8be;
  --sun: #ffd166;
  --display: 'Fredoka', 'Nunito', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --outline: #4a3b52;
  --track: #dfe4f0;
  --shadow: #d6dbe8;
  --locked: #e3e7f1;
  --locked-ink: #a9b0c2;
  --star-off: #d9dde8;
  --table: #f7e3cf;
  --table-edge: #ecd0b4;
  --table-side: #d9b48f;
  --tray: #e3e7f1;
  --alt: #e9edf6;
  --alt-edge: #d0d6e4;
  --scrim: rgba(74,59,82,.35);
  --room-dim: none;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1d1829;
  --card: #2b2440;
  --ink: #f3eaf8;
  --soft: #b2a5c6;
  --track: #15111f;
  --shadow: #120e1b;
  --locked: #241e35;
  --locked-ink: #675d80;
  --star-off: #463d5e;
  --table: #4a3d4a;
  --table-edge: #3a2f3b;
  --table-side: #2c232d;
  --tray: #262036;
  --alt: #3a3252;
  --alt-edge: #211b31;
  --scrim: rgba(8,5,14,.6);
  --room-dim: brightness(.72) saturate(.85);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

/* ---------- menu ---------- */
#menu { flex: 1; overflow-y: auto; padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; justify-content: space-between; align-items: center; }
.themebtn { display: flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 7px 12px 7px 9px; background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--shadow); font-weight: 800; font-size: 13px; }
.themebtn svg { width: 18px; height: 18px; }
.top a { color: var(--soft); font-weight: 700; font-size: 14px; text-decoration: none; }
.logo { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1; margin: 0; color: var(--ink); letter-spacing: .5px; }
.logo span { color: var(--pink); }
.tag { margin: 6px 0 0; color: var(--soft); font-size: 15px; line-height: 1.45; max-width: 36ch; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--track); padding: 5px; border-radius: 16px; }
.modes button { border: 0; background: none; padding: 10px; border-radius: 12px; font-family: var(--display); font-weight: 600; font-size: 16px; color: var(--soft); }
.modes button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--shadow); }
.modehint { margin: -6px 2px 0; font-size: 13px; color: var(--soft); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.lv { position: relative; aspect-ratio: 1 / 1.05; border: 0; border-radius: 20px; background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0)), var(--card); box-shadow: 0 4px 0 var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; }
.lv:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--shadow); }
.lv .n { font-family: var(--display); font-weight: 700; font-size: 26px; }
.lv .ty { font-size: 11px; font-weight: 800; color: var(--soft); text-transform: uppercase; letter-spacing: .4px; }
.lv svg.ic { width: 30px; height: 30px; }
.stars { font-size: 14px; letter-spacing: 1px; color: #e0c27a; }
.stars .off { color: var(--star-off); }
.lv.locked { background: var(--locked); box-shadow: none; color: var(--locked-ink); }
.lv.locked .lock { width: 26px; height: 26px; }
.lv.next { outline: 3px solid var(--pink); outline-offset: -3px; }

/* ---------- play ---------- */
#play { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
.iconbtn { width: 40px; height: 40px; border: 0; background-image: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0)); border-radius: 12px; background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--shadow); display: grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; }
.ttl { flex: 1; min-width: 0; }
.ttl b { display: block; font-family: var(--display); font-weight: 600; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttl small { display: block; color: var(--soft); font-size: 13px; font-weight: 700; }
.timer { height: 8px; margin: 0 12px; border-radius: 4px; background: var(--track); overflow: hidden; }
.timer div { height: 100%; width: 100%; background: linear-gradient(90deg, var(--mint), #5cc7a8); transition: width .2s linear; }
.timer.low div { background: linear-gradient(90deg, #ff9f9f, var(--pink)); }
.wrap { flex: 1; min-height: 0; position: relative; }
.board { position: absolute; left: 50%; top: 0; width: 360px; height: 600px; transform-origin: top center; touch-action: none; }

/* pieces on the board */
.it { position: absolute; touch-action: none; cursor: grab; transition: transform .18s ease, opacity .25s; will-change: left, top, transform; }
.it svg { width: 100%; height: 100%; display: block; overflow: visible; filter: url(#soft); }
.bin svg, .lv svg.ic, .mbox svg { filter: url(#soft); }
.it.drag { cursor: grabbing; z-index: 250 !important; transition: transform .1s; filter: drop-shadow(0 16px 10px rgba(40,25,50,.3)); }
.it.item { filter: drop-shadow(0 5px 3px rgba(40,25,50,.24)); }
.it.warm { filter: drop-shadow(0 0 6px rgba(255,209,102,.95)) drop-shadow(0 0 14px rgba(255,209,102,.7)) !important; }
.it.done { cursor: default; }
.it.shake { animation: shake .35s; }
@keyframes shake { 0%, 100% { translate: 0 0; } 25% { translate: -7px 0; } 75% { translate: 7px 0; } }
.pop { animation: popin .3s cubic-bezier(.3,1.6,.5,1); }
@keyframes popin { from { transform: scale(.6); } to { transform: scale(1); } }

.table { position: absolute; border-radius: 26px; background: radial-gradient(120% 80% at 30% 15%, rgba(255,255,255,.35), transparent 60%), var(--table); box-shadow: inset 0 3px 0 rgba(255,255,255,.45), inset 0 -6px 0 var(--table-edge), 0 12px 0 var(--table-side), 0 22px 22px rgba(40,25,50,.18); }
.bin { position: absolute; border-radius: 22px 22px 28px 28px; border: 0; color: var(--outline); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 8px; transition: transform .15s; }
.bin { background-image: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 55%, rgba(0,0,0,.06)); box-shadow: inset 0 -10px 0 rgba(0,0,0,.08), inset 0 3px 0 rgba(255,255,255,.7), 0 8px 0 rgba(40,25,50,.12), 0 16px 22px rgba(40,25,50,.16); }
.bin::before { content: ''; position: absolute; left: 9px; right: 9px; top: 9px; height: 30px; border-radius: 14px 14px 10px 10px; background: rgba(74,59,82,.2); box-shadow: inset 0 8px 8px rgba(40,25,50,.25); }
.bin .lbl { font-family: var(--display); font-weight: 600; font-size: 14px; background: rgba(255,255,255,.85); border-radius: 10px; padding: 2px 8px; }
.bin .cnt { font-size: 12px; font-weight: 800; color: var(--outline); opacity: .7; margin-top: 2px; }
.bin svg { width: 34px; height: 34px; margin-bottom: 2px; }
.bin.ok { transform: scale(1.06); }
.bin.bad { animation: shake .35s; box-shadow: 0 0 0 3px #ff8fab, 0 16px 22px rgba(40,25,50,.16); }

.box { position: absolute; border-radius: 10px; background: #dcae83; border: 0; border-radius: 14px; box-shadow: inset 0 14px 12px -4px rgba(120,75,40,.45), inset 12px 0 10px -6px rgba(120,75,40,.3), inset -12px 0 10px -6px rgba(120,75,40,.3), inset 0 -4px 0 rgba(255,240,215,.6), 0 10px 0 #b98552, 0 22px 26px rgba(40,25,50,.2); }
.box::before, .box::after { content: ''; position: absolute; top: 10px; bottom: 10px; width: 22px; background: linear-gradient(90deg, #e2b88d, #edcfa6); border: 0; box-shadow: 0 6px 10px rgba(40,25,50,.12); z-index: -1; }
.box::before { left: -24px; border-radius: 8px 2px 2px 8px; transform: skewY(-8deg); }
.box::after { right: -24px; border-radius: 2px 8px 8px 2px; transform: skewY(8deg); }
.cell { position: absolute; border-radius: 6px; background: rgba(255,240,220,.4); box-shadow: inset 0 4px 5px rgba(90,55,30,.28), 0 1px 0 rgba(255,255,255,.4); }
.it.piece { filter: drop-shadow(0 4px 2px rgba(40,25,50,.25)); }
.box.suitcase { background: #ffeef4; border-radius: 22px; box-shadow: inset 0 0 0 10px #8fd0fa, inset 0 0 0 12px #6bb5e6, inset 0 18px 14px 6px rgba(224,108,139,.16), 0 10px 0 #5aa6d6, 0 22px 26px rgba(40,25,50,.2); }
.box.suitcase::before { left: 50%; top: -22px; bottom: auto; width: 76px; height: 22px; margin-left: -38px; transform: none; background: none; border: 7px solid #5aa6d6; border-bottom: 0; border-radius: 16px 16px 0 0; box-shadow: none; }
.box.suitcase::after { display: none; }
.box.suitcase .cell { background: rgba(255,255,255,.55); box-shadow: inset 0 3px 4px rgba(200,110,150,.22); outline: 2px dashed rgba(255,143,171,.4); outline-offset: -5px; }
.box.lunch { background: #fff6fa; border-radius: 26px; box-shadow: inset 0 0 0 10px #ffbfd0, inset 0 0 0 12px #f7a1bb, inset 0 16px 14px 6px rgba(224,108,139,.16), 0 10px 0 #e88aa6, 0 22px 26px rgba(40,25,50,.18); }
.box.lunch::before, .box.lunch::after { top: 35%; bottom: 35%; width: 14px; background: #ffd166; transform: none; border-radius: 6px; }
.box.lunch::before { left: -17px; } .box.lunch::after { right: -17px; }
.box.lunch .cell { background: rgba(255,180,200,.18); box-shadow: inset 0 3px 4px rgba(200,110,150,.2); }
.box.chest { background: repeating-linear-gradient(90deg, #c99a6e 0 26px, #b98552 26px 29px); box-shadow: inset 0 12px 0 #8f6440, inset 10px 0 0 #a8774c, inset -10px 0 0 #a8774c, inset 0 -6px 0 #d9ab80, 0 10px 0 #8f6440, 0 22px 26px rgba(40,25,50,.2); }
.box.chest::before, .box.chest::after { top: auto; bottom: -6px; width: 18px; height: 18px; background: #ffd166; transform: none; border-radius: 4px; }
.box.chest::before { left: -8px; } .box.chest::after { right: -8px; }
.box.chest .cell { background: rgba(255,235,210,.22); }
.tray { position: absolute; border-radius: 22px; background: var(--tray); box-shadow: inset 0 6px 12px rgba(40,25,50,.1), inset 0 -2px 0 rgba(255,255,255,.4); }

.room { position: absolute; overflow: visible; }
.room > svg:first-child { filter: var(--room-dim); transition: filter .3s; }
.spot { position: absolute; border: 3px dashed var(--pink); border-radius: 14px; background: rgba(255,143,171,.12); opacity: 0; transition: opacity .2s; pointer-events: none; animation: glowspot 1s infinite alternate; }
.spot.show { opacity: 1; }
@keyframes glowspot { from { box-shadow: 0 0 0 0 rgba(255,143,171,.0); } to { box-shadow: 0 0 18px 4px rgba(255,143,171,.55); } }
.mbox { position: absolute; border: 0; background: none; padding: 0; }
.mbox svg { width: 100%; height: 100%; overflow: visible; }
.mbox .flapL, .mbox .flapR { transition: transform .35s cubic-bezier(.3,1.5,.5,1); }
.mbox.open .flapL { transform: rotate(-38deg); }
.mbox.open .flapR { transform: rotate(38deg); }
.note { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; color: var(--soft); font-size: 14px; pointer-events: none; }

.spark { position: absolute; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; animation: spark .7s ease-out forwards; z-index: 60; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

/* ---------- win / lose ---------- */
.overlay { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
.card { width: 100%; max-width: 330px; background: var(--card); border-radius: 28px; padding: 24px 20px 18px; text-align: center; box-shadow: 0 8px 0 var(--shadow); animation: popin .35s cubic-bezier(.3,1.6,.5,1); }
.card h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 34px; color: var(--pink); }
.card p { margin: 8px 0 0; color: var(--soft); font-weight: 700; line-height: 1.4; }
.bigstars { font-size: 42px; letter-spacing: 6px; margin-top: 8px; color: #f2b84b; }
.bigstars .off { color: var(--star-off); }
.btns { display: grid; gap: 8px; margin-top: 16px; }
.btn { border: 0; border-radius: 16px; padding: 13px; font-family: var(--display); font-weight: 600; font-size: 18px; background: var(--pink); color: #fff; box-shadow: 0 4px 0 #e06c8b; }
.btn.alt { background: var(--alt); color: var(--ink); box-shadow: 0 4px 0 var(--alt-edge); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #e06c8b; }
.confetti { position: fixed; top: -10px; width: 9px; height: 14px; border-radius: 3px; z-index: 99; pointer-events: none; animation: fall 1.8s ease-in forwards; }
@keyframes fall { to { transform: translate(var(--dx), 105vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) { .confetti, .spark { display: none; } .spot { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <main id="menu">
    <div class="top"><a href="./">‹ Pocket Arcade</a><button type="button" class="themebtn" id="themeBtn" aria-pressed="false"></button></div>
    <div>
      <h1 class="logo">Tidy <span>Time</span></h1>
      <p class="tag">Pack boxes, sort things where they belong and set up cozy rooms. No rush, no ads.</p>
    </div>
    <div class="modes" role="group" aria-label="Mode">
      <button type="button" id="mRelax" aria-pressed="true">Relaxed</button>
      <button type="button" id="mTimed" aria-pressed="false">Timed</button>
    </div>
    <p class="modehint" id="modeHint">No clock. Fewer mistakes means more stars.</p>
    <div class="grid" id="levels"></div>
  </main>

  <section id="play" hidden>
    <div class="bar">
      <button type="button" class="iconbtn" id="backBtn" aria-label="Back to levels"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="ttl"><b id="lvTitle">Level</b><small id="lvSub"></small></div>
      <button type="button" class="iconbtn" id="restartBtn" aria-label="Restart level"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M4 4v5h5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="timer" id="timer" hidden><div id="timerFill"></div></div>
    <div class="wrap" id="wrap"><div class="board" id="board"></div></div>
  </section>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="soft" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
    <feOffset in="b" dx="-4" dy="-5" result="up"/><feComposite in="SourceAlpha" in2="up" operator="out" result="rimLow"/>
    <feFlood flood-color="#3a2650" flood-opacity=".26"/><feComposite in2="rimLow" operator="in" result="shadeLow"/>
    <feOffset in="b" dx="3" dy="4" result="down"/><feComposite in="SourceAlpha" in2="down" operator="out" result="rimHigh"/>
    <feFlood flood-color="#ffffff" flood-opacity=".32"/><feComposite in2="rimHigh" operator="in" result="glowHigh"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shadeLow"/><feMergeNode in="glowHigh"/></feMerge>
  </filter>
</defs></svg>
<div class="overlay" id="over" hidden><div class="card"><h2 id="oTitle">Spotless!</h2><div class="bigstars" id="oStars"></div><p id="oText"></p><div class="btns" id="oBtns"></div></div></div>

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const OL = '#5b4a63', INK = OL, LINE = 'rgba(58,38,72,.3)';
const S = `stroke="${LINE}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"`;

// ---------- art: small items (viewBox 0 0 100 100) ----------
const ITEMS = {
  pencil: c => `<g transform="rotate(-35 50 50)"><rect x="16" y="40" width="60" height="20" rx="5" fill="${c}" ${S}/><rect x="20" y="44" width="52" height="4" rx="2" fill="#fff" opacity=".45"/><path d="M76 40 L94 50 L76 60 Z" fill="#f6d7a7" ${S}/><path d="M88 47 L94 50 L88 53 Z" fill="${INK}"/><rect x="8" y="40" width="12" height="20" rx="4" fill="#f4a3b4" ${S}/></g>`,
  book: c => `<rect x="22" y="12" width="58" height="76" rx="7" fill="${c}" ${S}/><rect x="22" y="12" width="13" height="76" rx="5" fill="#000" opacity=".12"/><rect x="44" y="28" width="26" height="7" rx="3.5" fill="#fff" opacity=".75"/><rect x="44" y="40" width="18" height="5" rx="2.5" fill="#fff" opacity=".55"/>`,
  apple: () => `<path d="M50 30 C30 18 14 36 20 58 C26 80 40 88 50 82 C60 88 74 80 80 58 C86 36 70 18 50 30 Z" fill="#ff6b6b" ${S}/><path d="M50 30 Q52 18 58 12" fill="none" ${S}/><path d="M56 22 Q70 12 76 22 Q66 30 56 22 Z" fill="#7fd8be" ${S}/><ellipse cx="34" cy="46" rx="6" ry="10" fill="#fff" opacity=".5"/>`,
  banana: () => `<path d="M30 20 C14 46 22 80 58 88 C72 91 84 86 91 78 C87 74 82 73 77 74 C56 77 40 62 42 24 C40 16 32 14 30 20 Z" fill="#ffd95e" ${S}/><path d="M30 20 C14 46 22 80 58 88 C72 91 84 86 91 78 C87 74 82 73 77 74 C56 77 40 62 42 24 C40 16 32 14 30 20 Z" fill="none" ${S}/><path d="M37 30 C33 52 42 70 62 78" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/><rect x="30" y="10" width="10" height="8" rx="3" fill="#8a6a52" ${S} transform="rotate(12 35 14)"/><circle cx="90" cy="78" r="3.5" fill="${INK}"/>`,
  grapes: () => `${[[50, 34], [38, 46], [62, 46], [44, 58], [56, 58], [50, 70], [32, 34], [68, 34]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="11" fill="#b58df2" ${S}/>`).join('')}<path d="M50 24 L52 10" ${S}/><path d="M52 14 Q64 6 70 14 Q60 22 52 14 Z" fill="#7fd8be" ${S}/>`,
  orange: () => `<circle cx="50" cy="54" r="32" fill="#ffa95e" ${S}/><path d="M50 22 Q60 10 70 16 Q62 26 50 22 Z" fill="#7fd8be" ${S}/><circle cx="38" cy="44" r="6" fill="#fff" opacity=".45"/>`,
  carrot: () => `<path d="M30 30 L70 34 L44 92 Z" fill="#ff9f43" ${S}/><path d="M40 46 L52 46 M38 60 L50 60 M44 74 L50 74" ${S}/><path d="M48 32 Q40 10 30 12 M52 32 Q56 8 66 10 M56 33 Q74 18 80 26" fill="none" stroke="#5cc7a8" stroke-width="6" stroke-linecap="round"/>`,
  broccoli: () => `<path d="M42 56 L40 90 L60 90 L58 56 Z" fill="#a8e6a1" ${S}/>${[[34, 44], [50, 34], [66, 44], [50, 52], [40, 30], [62, 30]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="15" fill="#5cc78a" ${S}/>`).join('')}`,
  eggplant: () => `<path d="M58 30 C84 40 80 84 52 88 C26 92 20 64 36 52 C46 44 44 34 58 30 Z" fill="#9b6dd6" ${S}/><path d="M50 30 Q60 18 72 26 Q64 36 50 30 Z" fill="#7fd8be" ${S}/><path d="M60 24 L62 12" ${S}/><ellipse cx="44" cy="66" rx="5" ry="10" fill="#fff" opacity=".35" transform="rotate(30 44 66)"/>`,

// ---------- art: furniture seen from the corner (2:1 isometric) ----------
// x runs toward the right wall's front corner, y toward the left wall's front corner, z is up.
const lp = (x, y, z = 0) => [x - y, (x + y) / 2 - z];
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return '#' + [n >> 16, n >> 8 & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
}
const pth = (pts, fill, line = true) => `<path d="M${pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L')} Z" fill="${fill}"${line ? ` stroke="${LINE}" stroke-width="1.6" stroke-linejoin="round"` : ''}/>`;
function isoBox(x, y, z, w, d, h, c) {
  return pth([lp(x + w, y, z), lp(x + w, y + d, z), lp(x + w, y + d, z + h), lp(x + w, y, z + h)], shade(c, -.2))
    + pth([lp(x, y + d, z), lp(x + w, y + d, z), lp(x + w, y + d, z + h), lp(x, y + d, z + h)], c)
    + pth([lp(x, y, z + h), lp(x + w, y, z + h), lp(x + w, y + d, z + h), lp(x, y + d, z + h)], shade(c, .22));
}

          if (placed === total) { [...board.querySelectorAll('.it')].forEach(n => n.classList.add('done')); win(); }
        } else {
          const overBox = parseFloat(it.style.left) > bx - C && parseFloat(it.style.top) < by + lv.h * C;
          if (overBox) mistake();
          toTray();
        }

  });
  return pieces.length;
}

// ---------- ROOM (corner view, like a little diorama) ----------
const ISO = { ox: 180, oy: 196, N: 172, H: 170 }, RY = 8;
const isoP = (x, y, z = 0) => [ISO.ox + x - y, ISO.oy + (x + y) / 2 - z];
function roomBG(wall, floor, opt = {}) {
  const N = ISO.N, H = ISO.H, T = 8, SL = 14, P = isoP;
  const poly = (pts, fill, line = true, extra = '') => `<path d="M${pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L')} Z" fill="${fill}"${line ? ` stroke="${LINE}" stroke-width="2" stroke-linejoin="round"` : ''} ${extra}/>`;
  const wl = shade(wall, -.1), win = opt.win || 'R', paper = opt.paper || 'plain', ft = opt.floor || 'planks';
  // a point on the left wall (x = 0) or right wall (y = 0)
  const WP = (side, u, z) => side === 'L' ? P(0, u, z) : P(u, 0, z);
  const wallPattern = side => {
    if (paper === 'stripes') return rep(12, i => { const u = 8 + i * 14; return `<path d="M${WP(side, u, 9).join(' ')} L${WP(side, u, H - 3).join(' ')}" stroke="#fff" stroke-opacity=".3" stroke-width="5"/>`; }).join('');
    if (paper === 'dots') return rep(8, i => rep(7, j => { const u = 12 + i * 21 + (j % 2) * 10, z = 20 + j * 22; return u < N - 4 ? `<circle cx="${WP(side, u, z)[0]}" cy="${WP(side, u, z)[1]}" r="2.6" fill="#fff" opacity=".5"/>` : ''; }).join('')).join('');
    return '';
  };
  const windowOn = side => {
    const [u0, u1] = side === 'L' ? [50, 110] : [36, 96], m = (u0 + u1) / 2;
    const sun = WP(side, side === 'L' ? u0 + 14 : u1 - 12, 112);
    const sill = side === 'L' ? [P(0, u0 - 4, 62), P(0, u1 + 4, 62), P(6, u1 + 4, 62), P(6, u0 - 4, 62)] : [P(u0 - 4, 0, 62), P(u1 + 4, 0, 62), P(u1 + 4, 6, 62), P(u0 - 4, 6, 62)];
    return poly([WP(side, u0, 66), WP(side, u1, 66), WP(side, u1, 126), WP(side, u0, 126)], '#e9f7ff')
      + `<circle cx="${sun[0]}" cy="${sun[1]}" r="7" fill="#ffd166" opacity=".85"/>`
      + `<path d="M${WP(side, m, 66).join(' ')} L${WP(side, m, 126).join(' ')} M${WP(side, u0, 96).join(' ')} L${WP(side, u1, 96).join(' ')}" stroke="${INK}" stroke-width="3"/>`
      + poly(sill, '#ffffff');
  };
  const sunPatch = side => side === 'L' ? poly([P(0, 44), P(0, 114), P(80, 164), P(80, 94)], '#fffbe6', false, 'opacity=".28"') : poly([P(30, 0), P(100, 0), P(150, 80), P(80, 80)], '#fffbe6', false, 'opacity=".28"');
  const door = d => {
    const u0 = d.u, u1 = d.u + 36, side = d.wall;
    return poly([WP(side, u0 - 3, 0), WP(side, u1 + 3, 0), WP(side, u1 + 3, 90), WP(side, u0 - 3, 90)], '#ffffff')
      + poly([WP(side, u0, 0), WP(side, u1, 0), WP(side, u1, 86), WP(side, u0, 86)], WOOD)
      + poly([WP(side, u0 + 6, 48), WP(side, u1 - 6, 48), WP(side, u1 - 6, 78), WP(side, u0 + 6, 78)], shade(WOOD, .2))
      + poly([WP(side, u0 + 6, 10), WP(side, u1 - 6, 10), WP(side, u1 - 6, 40), WP(side, u0 + 6, 40)], shade(WOOD, .2))
      + `<circle cx="${WP(side, side === 'L' ? u0 + 7 : u1 - 7, 44)[0]}" cy="${WP(side, side === 'L' ? u0 + 7 : u1 - 7, 44)[1]}" r="3" fill="#ffd166" stroke="${INK}" stroke-width="2"/>`;
  };
  const floorPattern = () => {
    if (ft === 'tiles') return rep(6, i => rep(6, j => (i + j) % 2 ? poly([P(i * N / 6, j * N / 6), P((i + 1) * N / 6, j * N / 6), P((i + 1) * N / 6, (j + 1) * N / 6), P(i * N / 6, (j + 1) * N / 6)], '#ffffff', false, 'opacity=".35"') : '').join('')).join('')
      + rep(5, i => `<path d="M${P(0, (i + 1) * N / 6).join(' ')} L${P(N, (i + 1) * N / 6).join(' ')} M${P((i + 1) * N / 6, 0).join(' ')} L${P((i + 1) * N / 6, N).join(' ')}" stroke="#000" stroke-opacity=".08" stroke-width="2"/>`).join('');
    if (ft === 'carpet') return poly([P(8, 8), P(N - 8, 8), P(N - 8, N - 8), P(8, N - 8)], '#ffffff', false, 'opacity=".18"') + rep(40, i => { const q = P(10 + (i * 37) % 150, 10 + (i * 61) % 150); return `<circle cx="${q[0]}" cy="${q[1]}" r="1.4" fill="#000" opacity=".07"/>`; }).join('');
    return rep(7, i => `<path d="M${P(0, (i + 1) * N / 8).join(' ')} L${P(N, (i + 1) * N / 8).join(' ')}" stroke="#000" stroke-opacity=".07" stroke-width="2"/>`).join('');
  };
  return `<svg viewBox="0 0 360 430" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">`
    + `<ellipse cx="180" cy="396" rx="170" ry="22" fill="rgba(40,25,50,.13)"/>`
    // walls (left one a touch darker so the corner reads)
    + poly([P(0, 0), P(0, N), P(0, N, H), P(0, 0, H)], wl)
    + poly([P(0, 0), P(N, 0), P(N, 0, H), P(0, 0, H)], wall)
    + poly([P(0, 0), P(0, N), P(0, N, 7), P(0, 0, 7)], shade(wl, .55), false)
    + poly([P(0, 0), P(N, 0), P(N, 0, 7), P(0, 0, 7)], shade(wall, .55), false)
    + `<path d="M${P(0, 0).join(' ')} L${P(0, 0, H).join(' ')}" stroke="${INK}" stroke-opacity=".25" stroke-width="2"/>`
    + wallPattern('L') + wallPattern('R')
    + (win.includes('L') ? windowOn('L') : '') + (win.includes('R') ? windowOn('R') : '')
    + (opt.door ? door(opt.door) : '')
    // wall tops show their thickness
    + poly([P(-T, -T, H), P(N, -T, H), P(N, 0, H), P(0, 0, H), P(0, N, H), P(-T, N, H)], shade(wall, .45))
    // floor with planks, then the slab edge underneath
    + poly([P(0, 0), P(N, 0), P(N, N), P(0, N)], floor)
    + floorPattern()
    + (win.includes('L') ? sunPatch('L') : '') + (win.includes('R') ? sunPatch('R') : '')
    + poly([P(0, N), P(N, N), P(N, N, -SL), P(0, N, -SL)], shade(floor, -.16))
    + poly([P(N, 0), P(N, N), P(N, N, -SL), P(N, 0, -SL)], shade(floor, -.3))
    + poly([P(-T, N, -SL), P(0, N, -SL), P(0, N, H), P(-T, N, H)], shade(wl, -.18))
    + poly([P(N, -T, -SL), P(N, 0, -SL), P(N, 0, H), P(N, -T, H)], shade(wall, -.28))
    + `</svg>`;
}
// where a piece of furniture ends up, in board pixels, and how it's drawn there
function spotArt(name, o, a, b) {
  if (o.startsWith('wall')) {
    const W = WALLF[name], F = FURN[name], left = o === 'wallL';
    const [x, y] = left ? isoP(0, a + W.w, b + W.h) : isoP(a, 0, b + W.h);
    return { wall: true, x, y: y + RY, w: W.w, h: W.h, tf: `matrix(1,${left ? -.5 : .5},0,1,0,0)`, z: 2, svg: svgWrap(F.d, `0 0 ${F.w} ${F.h}`) };
  }
  const A = isoSVG(name, o), [px, py] = isoP(a, b);
  const depth = a + A.fw / 2 + b + A.fd / 2;
  return { wall: false, x: px - A.fd - A.pad, y: py - ISOF[name].H - A.pad + RY, w: A.w, h: A.h, tf: 'none', z: FLAT.has(name) ? 3 : 10 + Math.round(depth), svg: A.svg };
}
function playRoom(lv) {
  el('room', 0, RY, 360, 430, roomBG(lv.wall, lv.floor, lv.opt));
  const spots = lv.spots.map(([name, o, a, b], k) => Object.assign({ name, k, o }, spotArt(name, o, a, b)));
  window.__tidy.spots = spots;
  const layer = s => FLAT.has(s.name) ? 0 : s.wall ? 1 : 2;
  const order = spots.slice().sort((p, q) => layer(p) - layer(q) || p.z - q.z || p.k - q.k);
  const mb = document.createElement('button'); mb.type = 'button'; mb.className = 'mbox'; mb.setAttribute('aria-label', 'Open the moving box');
  Object.assign(mb.style, { left: '232px', top: '462px', width: '112px', height: '100px' });
  mb.innerHTML = `<svg viewBox="0 0 112 100"><ellipse cx="58" cy="96" rx="52" ry="6" fill="rgba(40,25,50,.16)"/><path d="M6 34 L84 34 L106 22 L106 84 L84 96 L6 96 Z" fill="#c99a6e" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><rect x="6" y="34" width="78" height="62" rx="4" fill="#e8c39e" stroke="${INK}" stroke-width="3"/><rect x="38" y="34" width="14" height="62" fill="#d9ab80"/><g class="flapL" style="transform-origin:8px 36px"><path d="M8 36 L46 36 L40 16 L4 22 Z" fill="#d9ab80" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/></g><g class="flapR" style="transform-origin:84px 36px"><path d="M44 36 L84 36 L104 22 L62 16 Z" fill="#d9ab80" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/></g><text x="45" y="74" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="14" fill="${INK}">HOME</text></svg>`;
  board.append(mb);
  const note = el('note', 0, 576, 360, 20); note.style.textAlign = 'left'; note.style.left = '18px';
  let next = 0, out = null, placed = 0; const n = spots.length, SNAP = 36;
  const upd = () => { note.textContent = next < n ? `${n - next} left in the box${out ? '' : ' · tap it'}` : 'Box is empty'; progress(placed, n, 'placed'); };
  upd();
  mb.addEventListener('click', () => {
    if (out || next >= n || game.over) return;
    const s = order[next++]; mb.classList.add('open'); setTimeout(() => mb.classList.remove('open'), 450); sfx.open();
    const hs = Math.min(1, 150 / Math.max(s.w, s.h)), hx = 24 + (190 - s.w * hs) / 2, hy = 452 + (116 - s.h * hs) / 2;
    const it = el('it', hx, hy, s.w, s.h, s.svg);
    it.style.transformOrigin = '0 0'; it.style.transform = `scale(${hs})`; it.style.zIndex = 200; it.classList.add('pop');
    out = it; it.dataset.name = s.name; upd();
    const home = () => { it.style.transform = `scale(${hs})`; glide(it, hx, hy); };
    const near = () => { const x = parseFloat(it.style.left), y = parseFloat(it.style.top); return spots.filter(o => o.name === s.name && !o.used).map(o => ({ o, d: Math.hypot(x - o.x, y - o.y) })).sort((p, q) => p.d - q.d)[0]; };
    draggable(it, {
      onStart() { it.style.transform = s.tf; },
      onMove(p) {
        if (s.wall) it.style.transform = `matrix(1,${p.x < 180 ? -.5 : .5},0,1,0,0)`;
        const c = near(); it.classList.toggle('warm', !!c && c.d < 70);
      },
      onDrop() {
        it.classList.remove('warm');
        const c = near(), target = c && c.d < SNAP ? c.o : null;
        if (target) {
          target.used = true; it.classList.add('done'); it.style.zIndex = target.z;
          if (target.svg !== s.svg) { it.innerHTML = target.svg; it.style.width = target.w + 'px'; it.style.height = target.h + 'px'; }
          it.style.transform = target.tf; glide(it, target.x, target.y); sfx.place(); sparks(target.x + target.w / 2, target.y + target.h / 2);
          placed++; out = null; upd();
          if (placed === n) { note.textContent = 'All moved in!'; win(); }
        } else {
          if (parseFloat(it.style.top) < 430) mistake();
          home(); upd();
        }
      },
    });
  });

}

// ---------- flow ----------
function startLevel(i) {
  game.i = i; game.mistakes = 0; game.over = false; combo = 0; clearInterval(game.timerId);
  const lv = L[i];
  $('menu').hidden = true; $('play').hidden = false; $('over').hidden = true;
  board.innerHTML = ''; fit();
  $('lvTitle').textContent = `${i + 1}. ${lv.name}`;
  const count = lv.type === 'sort' ? playSort(lv) : lv.type === 'pack' ? playPack(lv) : playRoom(lv);
  const timed = SV.mode === 'timed';
  $('timer').hidden = !timed;
  if (timed) {
    game.limit = Math.round((lv.type === 'sort' ? 3.2 : lv.type === 'pack' ? 7 : 7.5) * count + 12);
    game.start = performance.now();
    const tick = () => {
      const left = Math.max(0, game.limit - (performance.now() - game.start) / 1000), f = left / game.limit;
      $('timerFill').style.width = (f * 100) + '%'; $('timer').classList.toggle('low', f < .25);
      if (left <= 0 && !game.over) lose();
    };
    tick(); game.timerId = setInterval(tick, 200);
  }
}
function starsFor() {
  if (SV.mode === 'timed') { const f = 1 - (performance.now() - game.start) / 1000 / game.limit; return f > .5 ? 3 : f > .25 ? 2 : 1; }
  return game.mistakes <= 1 ? 3 : game.mistakes <= 3 ? 2 : 1;
}
const starHTML = (n, max = 3) => rep(max, k => `<span class="${k < n ? '' : 'off'}">★</span>`).join('');
function win() {
  if (game.over) return; game.over = true; clearInterval(game.timerId);
  const st = starsFor(), b = SV.best[game.i] = SV.best[game.i] || {}; b[SV.mode] = Math.max(b[SV.mode] || 0, st); saveSV();
  setTimeout(() => {
    sfx.win(); confetti();
    const last = game.i >= L.length - 1;
    showOver(['Spotless!', 'Neat!', 'So tidy!', 'Perfect!'][Math.floor(Math.random() * 4)], st,
      SV.mode === 'timed' ? `Finished with ${Math.round(game.limit - (performance.now() - game.start) / 1000)}s to spare.` : game.mistakes ? `${game.mistakes} oops. Fewer slips earn more stars.` : 'Not a single slip!',
      [[last ? 'Back to levels' : 'Next level', () => last ? toMenu() : startLevel(game.i + 1)], ['Play again', () => startLevel(game.i), true], ...(last ? [] : [['Levels', toMenu, true]])]);
  }, 450);
}
function lose() {
  game.over = true; clearInterval(game.timerId); sfx.wrong();
  showOver('Time’s up!', 0, 'So close. Try again, or switch to Relaxed mode for no clock.', [['Try again', () => startLevel(game.i)], ['Levels', toMenu, true]]);
}
function showOver(title, st, text, btns) {
  $('oTitle').textContent = title; $('oStars').innerHTML = st ? starHTML(st) : ''; $('oStars').hidden = !st; $('oText').textContent = text;
  const box = $('oBtns'); box.innerHTML = '';
  btns.forEach(([label, fn, alt]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (alt ? ' alt' : ''); b.textContent = label; b.onclick = () => { $('over').hidden = true; fn(); }; box.append(b); });
  $('over').hidden = false; box.firstChild.focus();
}
function confetti() {
  const cols = ['#ff8fab', '#ffd166', '#7fd8be', '#7fc8f8', '#b58df2'];
  for (let i = 0; i < 40; i++) { const c = document.createElement('div'); c.className = 'confetti'; c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % 5]; c.style.animationDelay = Math.random() * .4 + 's'; c.style.setProperty('--dx', (Math.random() - .5) * 120 + 'px'); document.body.append(c); setTimeout(() => c.remove(), 2400); }
}
function toMenu() { clearInterval(game.timerId); game.over = true; $('play').hidden = true; $('menu').hidden = false; renderMenu(); }
function renderMenu() {
  $('mRelax').setAttribute('aria-pressed', SV.mode === 'relaxed'); $('mTimed').setAttribute('aria-pressed', SV.mode === 'timed');
  $('modeHint').textContent = SV.mode === 'timed' ? 'Beat the clock. Finish faster for more stars.' : 'No clock. Fewer mistakes means more stars.';
  const g = $('levels'); g.innerHTML = '';
  const firstOpen = L.findIndex((_, i) => unlocked(i) && !cleared(i));
  L.forEach((lv, i) => {
    const b = document.createElement('button'); b.type = 'button'; const open = unlocked(i), st = bestOf(i)[SV.mode] || 0;
    b.className = 'lv' + (open ? '' : ' locked') + (i === firstOpen ? ' next' : '');
    b.innerHTML = open ? `<svg class="ic" viewBox="0 0 100 100">${TYPE_ICON[lv.type]}</svg><span class="n">${i + 1}</span><span class="ty">${TYPE_LABEL[lv.type]}</span><span class="stars">${starHTML(st)}</span>`
      : `<svg class="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="3" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.5"/></svg><span class="ty">Level ${i + 1}</span>`;
    b.setAttribute('aria-label', open ? `Level ${i + 1}, ${lv.name}, ${TYPE_LABEL[lv.type]}, ${st} stars` : `Level ${i + 1}, locked`);
    b.disabled = !open; b.onclick = () => { ac(); startLevel(i); };
    g.append(b);
  });
}
$('mRelax').onclick = () => { SV.mode = 'relaxed'; saveSV(); renderMenu(); };
$('mTimed').onclick = () => { SV.mode = 'timed'; saveSV(); renderMenu(); };
$('backBtn').onclick = toMenu;
$('restartBtn').onclick = () => startLevel(game.i);
renderMenu();
window.__tidy = { L, game, startLevel, SV };
})();

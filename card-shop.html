<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Card Shop</title>
<meta name="theme-color" content="#14172b">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #14172b; --panel: #1f2340; --panel2: #282d52; --line: #363c6b; --ink: #f4efe6; --soft: #a9a8c9;
  --gold: #ffcf4d; --gold-d: #c98f1f; --good: #5fe39a; --bad: #ff6b7a;
  --display: 'Baloo 2', 'Nunito', system-ui, sans-serif; --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(120% 60% at 50% 0%, #262b55 0%, var(--bg) 60%); color: var(--ink); font-family: var(--body); -webkit-tap-highlight-color: transparent; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
.app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }

/* ---------- header / tabs ---------- */
header { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
header a { color: var(--soft); text-decoration: none; font-weight: 800; font-size: 13px; }
.logo { flex: 1; text-align: center; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .5px; line-height: 1; }
.logo span { color: var(--gold); }
.coins { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 8px; font-family: var(--display); font-weight: 800; font-size: 17px; min-width: 86px; justify-content: flex-end; }
.coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, var(--gold) 45%, var(--gold-d)); box-shadow: inset 0 0 0 2px rgba(120,70,0,.35); flex: none; }
.coins.bump { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.12); } }
main { flex: 1; overflow-y: auto; padding: 4px 14px 20px; -webkit-overflow-scrolling: touch; }
nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); background: rgba(20,23,43,.92); border-top: 1px solid var(--line); }
nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border-radius: 12px; color: var(--soft); font-weight: 800; font-size: 12px; position: relative; }
nav button svg { width: 24px; height: 24px; }
nav button[aria-selected="true"] { color: var(--gold); background: var(--panel); }
nav .dot { position: absolute; top: 4px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--bg); }

h2 { font-family: var(--display); font-weight: 800; font-size: 20px; margin: 14px 0 8px; }
.sub { color: var(--soft); font-size: 13px; margin: -4px 0 12px; line-height: 1.4; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.btn { background: var(--gold); color: #2a1a00; font-family: var(--display); font-weight: 800; font-size: 16px; padding: 10px 16px; border-radius: 12px; box-shadow: 0 4px 0 var(--gold-d); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--gold-d); }
.btn:disabled { filter: grayscale(.8) brightness(.7); cursor: default; transform: none; }
.btn.alt { background: var(--panel2); color: var(--ink); box-shadow: 0 4px 0 #15182f; }
.btn.small { font-size: 13px; padding: 7px 10px; border-radius: 10px; }
.btn .coin { width: 16px; height: 16px; }

/* ---------- shop ---------- */
.banner { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; margin-top: 10px; background: linear-gradient(120deg, #3b2c7a, #1f6f8b); border: 1px solid rgba(255,255,255,.15); }
.banner b { font-family: var(--display); font-size: 17px; display: block; }
.banner small { color: #d6e4ff; font-size: 12.5px; }
.banner .grow { flex: 1; }
.shelf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pack { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px 10px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; position: relative; }
.pack .pk { width: 112px; height: 160px; filter: drop-shadow(0 10px 12px rgba(0,0,0,.45)); transition: transform .2s; }
.pack:hover .pk { transform: translateY(-3px) rotate(-2deg); }
.pack b { font-family: var(--display); font-size: 16px; }
.pack .odds { font-size: 11.5px; color: var(--soft); line-height: 1.35; min-height: 31px; }
.pack .btn { width: 100%; }
.pack.locked .pk { filter: grayscale(1) brightness(.5); }
.pack .lock { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.65); padding: 6px 10px; border-radius: 10px; font-size: 12px; font-weight: 800; white-space: nowrap; }
.case { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.case .grow { flex: 1; font-size: 13px; color: var(--soft); line-height: 1.4; }
.case .grow b { color: var(--ink); font-size: 14px; }

/* ---------- card ---------- */
.cwrap { position: relative; flex: none; }
.cscale { position: absolute; left: 0; top: 0; width: 250px; height: 350px; transform-origin: 0 0; }
.card { width: 250px; height: 350px; border-radius: 16px; position: relative; padding: 9px; color: #2b2140; font-family: var(--body);
  background: linear-gradient(155deg, var(--l) 0%, var(--c) 48%, var(--d) 100%); box-shadow: 0 8px 18px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.4); overflow: hidden; user-select: none; -webkit-user-select: none; }
.card .in { position: absolute; inset: 9px; border-radius: 10px; background: linear-gradient(180deg, #fffdf7, #fff4e2); display: flex; flex-direction: column; padding: 6px 7px 5px; gap: 4px; box-shadow: inset 0 0 0 1.5px rgba(43,33,64,.15); }
.card .top { display: flex; align-items: center; gap: 6px; height: 24px; }
.card .nm { font-family: var(--display); font-weight: 800; font-size: 18px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; padding-top: 2px; }
.card .hp { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1; color: var(--d); }
.card .hp small { font-size: 10px; margin-right: 1px; color: #2b2140; }
.gem { width: 21px; height: 21px; border-radius: 50%; display: inline-grid; place-items: center; background: radial-gradient(circle at 35% 30%, var(--l), var(--c) 55%, var(--d)); box-shadow: inset 0 0 0 1.5px rgba(43,33,64,.35); flex: none; }
.gem svg { width: 13px; height: 13px; }
.gem.sm { width: 15px; height: 15px; } .gem.sm svg { width: 9px; height: 9px; }
.card .win { position: relative; height: 150px; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 2.5px var(--d), 0 2px 0 rgba(0,0,0,.08); flex: none; }
.card .win svg.art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.card .win::after { content: ''; position: absolute; inset: 0; border-radius: 8px; box-shadow: inset 0 0 0 2.5px var(--d); pointer-events: none; }
.card .stage { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: #fff; background: var(--d); align-self: flex-start; padding: 2px 8px; border-radius: 0 0 8px 8px; margin-top: -4px; }
.card .atk { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px; padding: 3px 2px; border-bottom: 1px solid rgba(43,33,64,.12); }
.card .atk .cost { display: flex; gap: 1px; }
.card .atk .an { font-weight: 900; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .atk .cost { min-width: 50px; }
.card .atk .dmg { font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1; }
.card .fl { font-size: 9.3px; font-style: italic; line-height: 1.25; color: #5a4d6a; flex: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; padding: 0 2px; }
.card .meta { display: flex; align-items: center; justify-content: space-between; font-size: 9px; font-weight: 900; color: #6a5d7a; letter-spacing: .3px; }
.card .meta .weak { display: flex; align-items: center; gap: 3px; }
.card .rar { font-size: 11px; color: #2b2140; }
.r-H .rar, .r-R .rar { color: #c98f1f; }
.r-UR .rar { background: linear-gradient(90deg, #ff6bd5, #6bd5ff, #ffd56b); -webkit-background-clip: text; background-clip: text; color: transparent; }
/* holo + foil sheen */
.sheen { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge; opacity: .32;
  background: linear-gradient(115deg, transparent 18%, rgba(255,90,200,.55) 32%, rgba(90,255,230,.55) 44%, rgba(255,240,90,.55) 56%, rgba(140,120,255,.5) 68%, transparent 82%);
  background-size: 300% 300%; background-position: var(--fx, 40%) var(--fy, 40%); transition: background-position .15s; }
.sheen.dots { mix-blend-mode: overlay; opacity: .35; background: radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.5px) 0 0 / 9px 9px, linear-gradient(115deg, transparent 25%, rgba(255,255,255,.6) 50%, transparent 75%); background-size: 9px 9px, 300% 300%; background-position: 0 0, var(--fx, 40%) var(--fy, 40%); }
.card.r-H .win .sheen, .card.r-UR .sheen.full { display: block; }
.card .sheen { display: none; }
.card.v-f .sheen.full, .card.v-s .sheen.full { display: block; opacity: .3; }
.card.r-UR .sheen.full { opacity: .28; }
.card.v-f .in { background: linear-gradient(180deg, #f9fbff, #eef3ff); }
/* ultra rare: full art */
.card.r-UR .in { background: transparent; box-shadow: none; }
.card.r-UR .win { position: absolute; inset: 0; height: auto; border-radius: 10px; z-index: 0; }
.card.r-UR .win svg.art { transform: scale(1.02); }
.card.r-UR .in > :not(.win) { position: relative; z-index: 1; }
.card.r-UR .top { background: rgba(255,255,255,.86); border-radius: 9px; padding: 3px 6px; height: 30px; }
.card.r-UR .spacer { flex: 1; }
.card.r-UR .atks { background: rgba(255,255,255,.88); border-radius: 9px; padding: 2px 6px; }
.card.r-UR .stage { display: none; }
.card.r-UR .fl { background: rgba(255,255,255,.8); border-radius: 7px; padding: 2px 6px; flex: none; }
.card.r-UR .meta { background: rgba(255,255,255,.8); border-radius: 7px; padding: 1px 6px; }
.card.r-UR { background: linear-gradient(155deg, #ffe9a8, #ffcf4d 40%, #ff9ad5 70%, #8ad8ff); }
/* shiny */
.card.v-s { background: linear-gradient(155deg, #fffbe0, #ffd75e 40%, #e7a52c 75%, #fff1b0); }
.card.v-s .win svg.art > :not(rect:first-child) { }
.card.v-s .win svg.art .cr { filter: hue-rotate(var(--hue)) saturate(1.35) brightness(1.04); }
.card.v-s .win svg.art rect:first-child { }
.tag { position: absolute; z-index: 3; font-family: var(--display); font-weight: 800; font-size: 10px; padding: 2px 7px; border-radius: 6px; letter-spacing: .5px; }
.tag.shiny { top: 46px; right: 14px; background: linear-gradient(90deg, #fff3a8, #ffcf4d); color: #6a4300; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.tag.foil { top: 46px; right: 14px; background: linear-gradient(90deg, #c8f3ff, #e6d4ff); color: #3a2a7a; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.twinkle { position: absolute; z-index: 2; pointer-events: none; color: #fff; font-size: 14px; text-shadow: 0 0 6px #fff7b0; animation: twinkle 1.6s infinite; }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.5); } 50% { opacity: 1; transform: scale(1.1); } }
/* back */
.cback { width: 250px; height: 350px; border-radius: 16px; position: relative; overflow: hidden; box-shadow: 0 8px 18px rgba(0,0,0,.4);
  background: radial-gradient(circle at 50% 50%, #3b4aa0 0%, #1d2257 60%, #141838 100%); }
.cback::before { content: ''; position: absolute; inset: 10px; border-radius: 10px; border: 3px solid var(--gold); opacity: .85;
  background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,207,77,.12) 0 10deg, transparent 10deg 20deg); }
.cback svg { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; transform: translate(-50%, -50%); }

/* ---------- binder ---------- */
.prog { height: 12px; border-radius: 6px; background: var(--panel2); overflow: hidden; margin: 6px 0 4px; }
.prog div { height: 100%; background: linear-gradient(90deg, var(--gold), #ff9ad5); border-radius: 6px; transition: width .4s; }
.miles { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 4px; }
.mile { font-size: 11.5px; font-weight: 800; padding: 4px 8px; border-radius: 8px; background: var(--panel2); color: var(--soft); }
.mile.done { background: #2c5a3e; color: #c8ffd9; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: none; }
.chips button { flex: none; padding: 6px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; font-weight: 800; display: flex; align-items: center; gap: 5px; }
.chips button[aria-pressed="true"] { background: var(--gold); color: #2a1a00; border-color: var(--gold); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.slot { position: relative; border-radius: 9px; cursor: pointer; }
.slot .cnt { position: absolute; right: -4px; top: -6px; z-index: 4; background: var(--gold); color: #2a1a00; font-family: var(--display); font-weight: 800; font-size: 12px; padding: 0 7px; border-radius: 999px; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
.slot .vs { position: absolute; left: 4px; bottom: 4px; z-index: 4; display: flex; gap: 3px; }
.slot .vs span { font-size: 10px; font-weight: 900; padding: 1px 5px; border-radius: 5px; background: rgba(20,23,43,.85); }
.empty { border-radius: 9px; background: rgba(255,255,255,.04); border: 2px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #5d628f; font-family: var(--display); font-weight: 800; overflow: hidden; position: relative; }
.empty svg { width: 92%; opacity: .14; filter: brightness(0) invert(1); }
.empty span { position: absolute; bottom: 8px; font-size: 13px; }

/* ---------- market ---------- */
.row { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 8px; cursor: pointer; }
.row .th { width: 52px; height: 52px; border-radius: 10px; overflow: hidden; position: relative; }
.row .th svg { width: 100%; height: 100%; display: block; }
.row b { font-family: var(--display); font-size: 15px; display: block; line-height: 1.1; }
.row small { color: var(--soft); font-size: 12px; }
.row .pr { text-align: right; }
.row .pr b { font-size: 16px; display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
.up { color: var(--good); } .down { color: var(--bad); }
.spark { width: 62px; height: 20px; display: block; margin-left: auto; }
.news { padding: 10px 12px; border-radius: 14px; margin-bottom: 10px; font-size: 13.5px; line-height: 1.4; border: 1px solid; }
.news.hype { background: #18402c; border-color: #2f7a52; color: #c8ffd9; }
.news.slump { background: #4a1f2a; border-color: #8a3346; color: #ffd0d8; }
.toggle { display: flex; gap: 6px; margin-bottom: 10px; }

/* ---------- goals ---------- */
.ach { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 8px; }
.ach .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; background: var(--panel2); }
.ach.done .ic { background: linear-gradient(135deg, #ffcf4d, #ff9ad5); }
.ach b { font-size: 14.5px; display: block; }
.ach small { color: var(--soft); font-size: 12px; }
.ach .rw { font-family: var(--display); font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 4px; color: var(--gold); }
.ach.done .rw { color: var(--good); }

/* ---------- overlays ---------- */
.ov { position: fixed; inset: 0; z-index: 50; background: rgba(8,9,20,.86); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
.ov .x { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 12px; background: var(--panel); font-size: 22px; line-height: 1; }
.hint { color: var(--soft); font-weight: 800; font-size: 14px; margin-top: 14px; text-align: center; min-height: 20px; }
.packstage { position: relative; width: 190px; height: 272px; cursor: pointer; perspective: 900px; }
.packstage .pk { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 18px 26px rgba(0,0,0,.6)); }
.packstage .pk.top { clip-path: inset(0 0 87% 0); }
.packstage .pk.body { clip-path: inset(13% 0 0 0); }
.packstage.idle .pk { animation: float 2.4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-8px) rotate(-1.5deg); } }
.packstage.torn .pk.top { transition: transform .6s cubic-bezier(.3,.7,.4,1), opacity .6s; transform: translate(80px, -120px) rotate(28deg); opacity: 0; }
.packstage.torn .pk.body { transition: transform .5s .25s ease-in, opacity .4s .45s; transform: translateY(180px); opacity: 0; }
.packstage.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: rotate(-4deg); } 40% { transform: rotate(4deg); } 60% { transform: rotate(-3deg); } 80% { transform: rotate(2deg); } }
.reveal { position: relative; perspective: 1200px; cursor: pointer; }
.flip { position: absolute; left: 0; top: 0; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3,1.3,.5,1); }
.flip .face { position: absolute; left: 0; top: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip .face.front { transform: rotateY(180deg); }
.flip.open { transform: rotateY(180deg); }
.flip.gone { transition: transform .45s ease-in, opacity .45s; transform: rotateY(180deg) translate(-140%, 30%) rotate(-14deg) scale(.4); opacity: 0; }
.flip.enter { animation: deal .35s ease-out; }
@keyframes deal { from { transform: translateY(40px) scale(.9); opacity: 0; } }
.glow { position: absolute; inset: -30px; border-radius: 50%; filter: blur(22px); opacity: 0; transition: opacity .4s; pointer-events: none; }
.glow.on { opacity: .9; }
.callout { position: absolute; left: 50%; top: -42px; transform: translateX(-50%); font-family: var(--display); font-weight: 800; font-size: 24px; white-space: nowrap; letter-spacing: 1px; text-shadow: 0 3px 0 rgba(0,0,0,.4); animation: pop .5s cubic-bezier(.3,1.6,.5,1); z-index: 5; }
@keyframes pop { from { transform: translateX(-50%) scale(.3); opacity: 0; } }
.newb { position: absolute; z-index: 6; top: -10px; left: -10px; background: var(--bad); color: #fff; font-family: var(--display); font-weight: 800; font-size: 13px; padding: 2px 8px; border-radius: 8px; transform: rotate(-10deg); box-shadow: 0 3px 8px rgba(0,0,0,.4); }
.pulled { display: flex; gap: 4px; margin-top: 14px; min-height: 50px; }
.pulled > div { opacity: .95; }
.summary { width: min(100%, 520px); max-height: 100%; overflow-y: auto; text-align: center; }
.summary h3 { font-family: var(--display); font-size: 26px; margin: 4px 0; }
.summary .sgrid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 12px 0; }
.summary .sgrid > div { position: relative; }
.summary .val { font-family: var(--display); font-weight: 800; font-size: 13px; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 3px; }
.summary .acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.flash { position: fixed; inset: 0; background: #fff; z-index: 60; pointer-events: none; animation: flash .6s forwards; }
@keyframes flash { from { opacity: .9; } to { opacity: 0; } }
.burst { position: fixed; width: 10px; height: 10px; border-radius: 50%; z-index: 61; pointer-events: none; animation: burst .9s ease-out forwards; }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
.detail { width: min(100%, 420px); display: flex; flex-direction: column; align-items: center; gap: 12px; max-height: 100%; overflow-y: auto; padding-top: 30px; }
.tilt { transition: transform .2s ease-out; transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); }
.dinfo { width: 100%; }
.vline { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 6px; }
.vline b { font-size: 14px; } .vline small { color: var(--soft); }
.vline .p { font-family: var(--display); font-weight: 800; display: flex; align-items: center; gap: 4px; }
.toasts { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 6px; width: min(92vw, 420px); pointer-events: none; }
.toast { background: #2a2f5c; border: 1px solid #4a5196; border-radius: 14px; padding: 10px 12px; font-size: 13.5px; font-weight: 700; box-shadow: 0 8px 20px rgba(0,0,0,.4); display: flex; align-items: center; gap: 10px; animation: tin .35s ease-out; }
.toast .ti { font-size: 22px; }
.toast.out { animation: tout .3s forwards; }
@keyframes tin { from { transform: translateY(-20px); opacity: 0; } }

.confirm { width: min(100%, 360px); text-align: center; }
.confirm p { color: var(--soft); line-height: 1.45; }
@media (prefers-reduced-motion: reduce) { .packstage.idle .pk, .twinkle { animation: none; } }

<body>

<script>
// ---------- elements ----------
const ELEM = {
  fire:   { name: 'Fire',   c: '#ff7a45', d: '#d9481f', l: '#ffd29a', bg: ['#ffe2b8', '#ff9a66'], icon: 'M12 2 C17 8 19 12 16 17 C15 14 13 13 12 15 C11 13 9 14 8 17 C5 12 7 8 12 2 Z' },
  water:  { name: 'Water',  c: '#3fa2f5', d: '#1f6fc0', l: '#bfe6ff', bg: ['#d8f1ff', '#6ab8f5'], icon: 'M12 2 C16 8 19 12 19 15 A7 7 0 0 1 5 15 C5 12 8 8 12 2 Z' },
  leaf:   { name: 'Leaf',   c: '#4cbf72', d: '#2c8a4d', l: '#cdf2c4', bg: ['#e4f8d6', '#7fd29a'], icon: 'M4 20 C4 9 11 3 21 3 C21 13 15 20 4 20 Z M4 20 L13 11' },
  volt:   { name: 'Volt',   c: '#ffc928', d: '#d99a00', l: '#fff3b0', bg: ['#fff8cf', '#ffd65a'], icon: 'M13 2 L5 14 H11 L9 22 L19 9 H13 Z' },
  spirit: { name: 'Spirit', c: '#9a72e0', d: '#5e3fa6', l: '#e2d4ff', bg: ['#e9defc', '#8c6ad0'], icon: 'M12 3 A7 7 0 0 1 19 10 V20 L16.5 18 L14 20 L12 18 L10 20 L7.5 18 L5 20 V10 A7 7 0 0 1 12 3 Z' },
  stone:  { name: 'Stone',  c: '#b8906a', d: '#82603f', l: '#efdcc4', bg: ['#f3e7d6', '#c9a882'], icon: 'M3 18 L7 8 L13 5 L20 10 L21 18 Z' },
  frost:  { name: 'Frost',  c: '#6fd3ea', d: '#2f9fbd', l: '#dcf8ff', bg: ['#eefcff', '#9ee0f0'], icon: 'M12 2 V22 M3.3 7 L20.7 17 M3.3 17 L20.7 7' },
  sky:    { name: 'Sky',    c: '#8fb4ff', d: '#5577d6', l: '#e1ebff', bg: ['#eef4ff', '#a9c6ff'], icon: 'M5 16 A4 4 0 0 1 7 8.5 A5 5 0 0 1 16.5 8 A4 4 0 0 1 18 16 Z' },
};
const WEAK = { fire: 'water', water: 'volt', leaf: 'fire', volt: 'stone', spirit: 'spirit', stone: 'leaf', frost: 'fire', sky: 'volt' };
// rarity: C common, U uncommon, R rare, H holo rare, UR ultra rare
const RARITY = { C: { name: 'Common', v: 3 }, U: { name: 'Uncommon', v: 8 }, R: { name: 'Rare', v: 25 }, H: { name: 'Holo Rare', v: 80 }, UR: { name: 'Ultra Rare', v: 450 } };

// ---------- the Wildspark set ----------
// [name, element, rarity, stage, evolvesFrom, hp, [attack, cost, dmg], [attack, cost, dmg], flavor]
const CARD_LIST = [
  ['Toastle', 'fire', 'C', 0, null, 60, ['Crumb Toss', 1, 10], ['Hot Butter', 2, 30], 'Pops up every morning at exactly 7:00, ready to help.'],
  ['Toastomatic', 'fire', 'H', 1, 'Toastle', 150, ['Pop Up', 2, 50], ['Golden Brown', 3, 130], 'Two slots, four settings, zero patience for burnt toast.'],
  ['Matchling', 'fire', 'C', 0, null, 50, ['Strike', 1, 20], ['Spark Dash', 2, 30], 'Rubs its head on anything rough. Keep it away from paper.'],
  ['Torchknight', 'fire', 'R', 1, 'Matchling', 130, ['Shield Bash', 2, 40], ['Blazing Oath', 3, 110], 'Swore to light the way for anyone lost in the dark.'],
  ['Smorlet', 'fire', 'U', 0, null, 60, ['Toasty Tap', 1, 20], ['Goo Bomb', 2, 40], 'Smells like a summer campfire. Please do not eat it.'],
  ['Raindrip', 'water', 'C', 0, null, 50, ['Drizzle', 1, 10], ['Puddle Plop', 2, 30], 'Carries an umbrella everywhere. Nobody knows why.'],
  ['Stormbrella', 'water', 'H', 1, 'Raindrip', 140, ['Downpour', 2, 60], ['Thunder Twirl', 3, 120], 'Spins its canopy to call storms, then shelters anyone caught in them.'],
  ['Soapsud', 'water', 'C', 0, null, 60, ['Bubble Blow', 1, 10], ['Slippery Slide', 2, 30], 'Smells like lavender. Leaves everything squeaky clean.'],
  ['Lathertub', 'water', 'R', 1, 'Soapsud', 140, ['Foam Wave', 2, 50], ['Bath Blast', 3, 100], 'Its bath water is always the perfect temperature.'],
  ['Sushimi', 'water', 'U', 0, null, 80, ['Chopstick Jab', 1, 20], ['Wasabi Kick', 2, 50], 'Very proud of its salmon blanket. Do not touch the blanket.'],
  ['Pipseed', 'leaf', 'C', 0, null, 50, ['Sprinkle', 1, 10], ['Seed Shot', 2, 30], 'Waters itself every morning, then naps in the sun.'],
  ['Blossomage', 'leaf', 'H', 1, 'Pipseed', 140, ['Petal Storm', 2, 60], ['Full Bloom', 3, 120], 'One wave of its staff turns a parking lot into a meadow.'],
  ['Broccolo', 'leaf', 'C', 0, null, 70, ['Flex', 1, 10], ['Floret Press', 2, 30], 'Eats its vegetables. Lifts every day. Very proud of both.'],
  ['Gherkid', 'leaf', 'U', 0, null, 70, ['Toothpick Poke', 1, 20], ['Brine Charge', 2, 50], 'Escaped the jar and swore never to go back.'],

  ['Batteri', 'volt', 'C', 0, null, 50, ['Static Poke', 1, 10], ['Bolt Swing', 2, 30], 'Always sure it has more charge left than it really does.'],
  ['Megawatt', 'volt', 'R', 1, 'Batteri', 150, ['Jump Start', 2, 50], ['Overcharge', 3, 120], 'Can restart a car, a toaster, or a bad mood.'],
  ['Popkern', 'volt', 'C', 0, null, 50, ['Pop!', 1, 10], ['Butter Burst', 2, 30], 'Gets so excited it pops. Then gets excited about that.'],
  ['Lampling', 'volt', 'U', 0, null, 70, ['Night Light', 1, 20], ['Bright Idea', 2, 50], 'Stays up late reading and never needs a flashlight.'],
  ['Remoty', 'volt', 'U', 0, null, 60, ['Channel Flip', 1, 20], ['Power Off', 2, 50], 'Hides between the couch cushions on purpose.'],
  ['Spookie', 'spirit', 'C', 0, null, 50, ['Sprinkle Scare', 1, 10], ['Fresh Batch', 2, 30], 'Bakes itself every Halloween, then haunts the cookie jar.'],
  ['Hauntcake', 'spirit', 'H', 1, 'Spookie', 140, ['Ghost Frosting', 2, 50], ['Last Slice', 3, 130], 'Blow out its candles and they come right back, a little more purple.'],
  ['Snoozy', 'spirit', 'C', 0, null, 50, ['Yawn', 1, 10], ['Pillow Toss', 2, 20], 'Only haunts people who stay up way too late.'],
  ['Dreamwisp', 'spirit', 'R', 1, 'Snoozy', 120, ['Lullaby', 2, 40], ['Moonbeam', 3, 100], 'Rides the moon each night, delivering good dreams.'],
  ['Lanternette', 'spirit', 'U', 0, null, 80, ['Flicker Glow', 1, 20], ['Spirit Flame', 2, 50], 'Lights the path home for wandering spirits.'],
  ['Rocklet', 'stone', 'C', 0, null, 60, ['Sugar Smack', 1, 10], ['Crystal Bonk', 2, 30], 'Grows a new crystal every time it gets a compliment.'],
  ['Gemmajesty', 'stone', 'H', 1, 'Rocklet', 160, ['Royal Decree', 2, 60], ['Crown Jewel', 3, 130], 'Rules the crystal caves fairly, but expects a curtsy.'],
  ['Brickbo', 'stone', 'C', 0, null, 70, ['Trowel Tap', 1, 10], ['Wall Up', 2, 30], 'Has built over a thousand tiny walls. Still not done.'],
  ['Mittenkit', 'frost', 'C', 0, null, 60, ['Knit Purl', 1, 10], ['Yarn Toss', 2, 30], 'Knits itself a twin every winter, but only ever finds one.'],
  ['Scarfwyrm', 'frost', 'H', 1, 'Mittenkit', 150, ['Cozy Wrap', 2, 50], ['Blizzard Loop', 3, 130], 'Wraps around lost travelers and keeps them warm till morning.'],
  ['Iglooby', 'frost', 'U', 0, null, 90, ['Ice Fishing', 1, 20], ['Snow Fort', 2, 50], 'Always has a fish on the line. Never says where it caught it.'],
  ['Kitelet', 'sky', 'C', 0, null, 50, ['Tail Twirl', 1, 10], ['Gust Glide', 2, 30], 'Only flies on windy days, and never lets go of its string.'],
  ['Kitedrake', 'sky', 'H', 1, 'Kitelet', 140, ['Ribbon Lash', 2, 50], ['Festival Sky', 3, 120], 'Shows up at every kite festival. Nobody brought it.'],
  ['Tickletock', 'stone', 'UR', 0, null, 200, ['Wind Up', 2, 70], ['Big Chime', 4, 180], 'It has kept perfect time for three hundred years and is very smug about it.'],
  ['Cosmochef', 'sky', 'UR', 0, null, 210, ['Star Whisk', 2, 80], ['Supernova', 4, 200], 'Every star in the sky came out of its mixing bowl.'],
  ['Moonmochi', 'sky', 'UR', 0, null, 180, ['Mallet Bop', 2, 60], ['Moon Feast', 4, 220], 'Pounds moon mochi all night long. Look up and you might see it.'],
];
const CARDS = CARD_LIST.map(([name, el, r, stage, from, hp, a1, a2, flavor], i) => ({ id: i + 1, name, el, r, stage, from, hp, atk: [a1, a2], flavor }));
const BYNAME = Object.fromEntries(CARDS.map(c => [c.name, c]));

// ---------- creature art (viewBox 0 0 200 150) ----------
const O = '#2b2140';
const st = (w = 3) => `stroke="${O}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const ST = st();
const eye = (x, y, r = 6) => `<ellipse cx="${x}" cy="${y}" rx="${r * .82}" ry="${r}" fill="${O}"/><circle cx="${x - r * .28}" cy="${y - r * .38}" r="${r * .34}" fill="#fff"/><circle cx="${x + r * .25}" cy="${y + r * .35}" r="${r * .15}" fill="#fff" opacity=".8"/>`;
const slit = (x, y, r, c) => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * 1.05}" fill="${c}" ${st(2.5)}/><ellipse cx="${x}" cy="${y}" rx="${r * .28}" ry="${r * .8}" fill="${O}"/><circle cx="${x - r * .45}" cy="${y - r * .45}" r="${r * .22}" fill="#fff"/>`;
const blush = (x, y, r = 5) => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * .6}" fill="#ff6f9a" opacity=".42"/>`;
const shadow = (x, y, w) => `<ellipse cx="${x}" cy="${y}" rx="${w}" ry="${w * .16}" fill="#1a1030" opacity=".18"/>`;
const smile = (x, y, w = 6) => `<path d="M${x - w} ${y} Q${x} ${y + w * .9} ${x + w} ${y}" fill="none" ${st(2.5)}/>`;
const shine = (x, y, rx, ry, rot = -30) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" opacity=".45" transform="rotate(${rot} ${x} ${y})"/>`;
const flame = (x, y, s = 1, c1 = '#ff9a3b', c2 = '#ffe27a') => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 -22 C10 -10 13 -2 8 8 C5 3 3 2 0 6 C-3 2 -5 3 -8 8 C-13 -2 -10 -10 0 -22 Z" fill="${c1}" ${st(3 / s)}/><path d="M0 -8 C5 -2 5 3 2 7 L-2 7 C-5 3 -5 -2 0 -8 Z" fill="${c2}"/></g>`;
const spark = (x, y, s = 1, c = '#fff6a0') => `<path transform="translate(${x} ${y}) scale(${s})" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="${c}"/>`;
const leaf = (x, y, s = 1, rot = 0, c = '#5cc78a') => `<path transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" d="M0 0 C6 -10 18 -12 26 -10 C22 -2 12 6 0 0 Z" fill="${c}" ${st(2.5 / s)}/>`;
const P = (d, fill, w = 3, extra = '') => `<path d="${d}" fill="${fill}" ${st(w)} ${extra}/>`;
const E = (cx, cy, rx, ry, fill, w = 3, extra = '') => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}" ${w ? st(w) : ''} ${extra}/>`;
const C = (cx, cy, r, fill, w = 3, extra = '') => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" ${w ? st(w) : ''} ${extra}/>`;
const R = (x, y, w, h, rx, fill, sw = 3, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${sw ? st(sw) : ''} ${extra}/>`;

// one face style for the whole set (based on Smorlet): big glossy eyes, blush, small mouth
function face(x, y, k = 1, mood = 'smile') {
  const dx = 10 * k, r = 5.6 * k;
  let eyes = eye(x - dx, y, r) + eye(x + dx, y, r);
  if (mood === 'sleepy') eyes = `<path d="M${x - dx - 4.5 * k} ${y} Q${x - dx} ${y + 4.5 * k} ${x - dx + 4.5 * k} ${y} M${x + dx - 4.5 * k} ${y} Q${x + dx} ${y + 4.5 * k} ${x + dx + 4.5 * k} ${y}" fill="none" ${st(2.6)}/>`;
  if (mood === 'happy') eyes = `<path d="M${x - dx - 4.5 * k} ${y + 1.5 * k} Q${x - dx} ${y - 4.5 * k} ${x - dx + 4.5 * k} ${y + 1.5 * k} M${x + dx - 4.5 * k} ${y + 1.5 * k} Q${x + dx} ${y - 4.5 * k} ${x + dx + 4.5 * k} ${y + 1.5 * k}" fill="none" ${st(2.8)}/>`;
  const brows = mood === 'brave' ? `<path d="M${x - dx - 5 * k} ${y - 9 * k} L${x - dx + 4 * k} ${y - 6.5 * k} M${x + dx + 5 * k} ${y - 9 * k} L${x + dx - 4 * k} ${y - 6.5 * k}" ${st(2.6)}/>` : '';
  const my = y + 9 * k;
  let mouth = smile(x, my, 4.8 * k);
  if (mood === 'open' || mood === 'happy') mouth = `<path d="M${x - 5.5 * k} ${my - 1} Q${x} ${my + 9 * k} ${x + 5.5 * k} ${my - 1} Z" fill="#8a3048" ${st(2.4)}/><path d="M${x - 2.6 * k} ${my + 3.6 * k} Q${x} ${my + 1.4 * k} ${x + 2.6 * k} ${my + 3.6 * k} Q${x} ${my + 6.2 * k} ${x - 2.6 * k} ${my + 3.6 * k} Z" fill="#ff8fab"/>`;
  if (mood === 'grin') mouth = `<path d="M${x - 7 * k} ${my - 1} Q${x} ${my + 8 * k} ${x + 7 * k} ${my - 1} Z" fill="#fff" ${st(2.4)}/>`;
  if (mood === 'wow') mouth = `<ellipse cx="${x}" cy="${my + 1.5 * k}" rx="${3.2 * k}" ry="${4 * k}" fill="#8a3048" ${st(2.2)}/>`;
  if (mood === 'brave') mouth = `<path d="M${x - 5 * k} ${my} Q${x} ${my + 4 * k} ${x + 5 * k} ${my}" fill="none" ${st(2.6)}/>`;
  return eyes + brows + mouth + blush(x - 18 * k, y + 7 * k, 5 * k) + blush(x + 18 * k, y + 7 * k, 5 * k);
}
const hand = (x, y, c, r = 6) => C(x, y, r, c, 2.6);
const limb = (x1, y1, x2, y2, c, w = 7) => `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${O}" stroke-width="${w + 5}" stroke-linecap="round"/><path d="M${x1} ${y1} L${x2} ${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const bend = (d, c, w = 7) => `<path d="${d}" fill="none" stroke="${O}" stroke-width="${w + 5}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const bubble = (x, y, r) => C(x, y, r, '#ffffff', 2, 'fill-opacity=".35"') + `<path d="M${x - r * .5} ${y - r * .2} Q${x - r * .4} ${y - r * .55} ${x - r * .05} ${y - r * .6}" stroke="#fff" stroke-width="${Math.max(1.5, r * .22)}" fill="none" stroke-linecap="round"/>`;
const zz = (x, y) => `<text x="${x}" y="${y}" font-family="Baloo 2, sans-serif" font-weight="800" font-size="15" fill="${O}" opacity=".65">z</text><text x="${x + 12}" y="${y - 12}" font-family="Baloo 2, sans-serif" font-weight="800" font-size="11" fill="${O}" opacity=".45">z</text>`;

const ART = {
  Toastle: () => shadow(100, 141, 38)
    + `<path d="M84 22 Q80 14 86 8 M100 20 Q96 12 102 6 M116 22 Q112 14 118 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>`
    + E(88, 134, 9, 6, '#c98a4a') + E(112, 134, 9, 6, '#c98a4a') + limb(90, 124, 88, 132, '#e0a35a', 6) + limb(110, 124, 112, 132, '#e0a35a', 6)
    + bend('M64 92 Q50 98 46 108', '#e0a35a', 7)
    + `<g transform="rotate(-38 40 104)">${R(34, 64, 12, 40, 6, '#eef3fb')}${R(35.5, 102, 9, 18, 4, '#9a6440')}</g>` + hand(46, 108, '#e0a35a')
    + P('M64 128 L64 72 Q52 68 54 52 Q58 32 82 34 Q100 22 118 34 Q142 32 146 52 Q148 68 136 72 L136 128 Z', '#d99447')
    + P('M72 122 L72 76 Q63 72 64 59 Q67 43 85 44 Q100 34 115 44 Q133 43 136 59 Q137 72 128 76 L128 122 Z', '#ffe2a8', 0)
    + E(84, 110, 5, 3, '#f2c27a', 0) + E(118, 70, 4, 2.5, '#f2c27a', 0) + E(112, 114, 3.5, 2.2, '#f2c27a', 0) + shine(84, 58, 9, 5)
    + `<g transform="rotate(-8 100 34)">${R(88, 26, 26, 14, 4, '#fff2a6')}${R(90, 28, 22, 4, 2, '#fff', 0, 'opacity=".7"')}</g>` + P('M110 40 Q112 50 108 52 Q105 48 107 40 Z', '#fff2a6', 2)
    + face(100, 86, 1.1, 'open')
    + bend('M136 90 Q148 84 152 74', '#e0a35a', 7) + hand(152, 72, '#e0a35a'),

  Toastomatic: () => shadow(100, 143, 56)
    + flame(100, 36, 1.5, '#ff7a2f')
    + `<g transform="rotate(-12 80 44)">${P('M66 66 L66 34 Q60 30 62 22 Q66 12 80 14 Q92 10 98 22 Q100 30 94 34 L94 66 Z', '#d99447')}${P('M71 62 L71 37 Q66 34 67 27 Q70 19 80 20 Q90 17 92 27 Q93 34 89 37 L89 62 Z', '#ffe2a8', 0)}</g>`
    + `<g transform="rotate(10 122 40)">${P('M108 66 L108 30 Q102 26 104 18 Q108 8 122 10 Q134 6 140 18 Q142 26 136 30 L136 66 Z', '#d99447')}${P('M113 62 L113 33 Q108 30 109 23 Q112 15 122 16 Q132 13 134 23 Q135 30 131 33 L131 62 Z', '#ffe2a8', 0)}</g>`
    + bend('M54 84 Q38 74 34 56', '#ff8a6b', 8) + `<g transform="rotate(-20 32 50)">${P('M20 54 Q18 34 32 32 Q46 32 44 50 L44 60 L22 60 Z', '#ffd6e0')}${R(20, 58, 26, 8, 3, '#ff8fab', 2.5)}<path d="M26 40 L38 40 M26 48 L38 48" stroke="#ff8fab" stroke-width="3"/></g>`
    + R(50, 54, 100, 80, 24, '#ff7f66') + R(56, 58, 88, 10, 5, '#ffa48f', 0) + shine(70, 70, 10, 5)
    + R(64, 50, 30, 9, 4, '#3a2c3e', 2.5) + R(106, 50, 30, 9, 4, '#3a2c3e', 2.5)
    + R(50, 104, 100, 16, 0, '#e6ecf5') + `<path d="M50 104 H150 M50 120 H150" ${st(3)}/>`
    + C(132, 112, 6, '#ffd166', 2.5) + R(150, 72, 14, 8, 3, '#c9d6e3', 2.5) + C(166, 76, 6, '#3a2c3e', 2.5)
    + E(66, 136, 9, 5, '#c9d6e3') + E(134, 136, 9, 5, '#c9d6e3')
    + face(98, 82, 1.15, 'grin') + `<path d="M80 70 L90 73 M116 70 L106 73" ${st(2.6)}/>`
    + bend('M150 96 Q168 92 172 74', '#ff8a6b', 8) + `<path d="M172 74 L178 34" stroke="${O}" stroke-width="9" stroke-linecap="round"/><path d="M172 74 L178 34" stroke="#3a2c3e" stroke-width="4" stroke-linecap="round"/>` + R(168, 16, 22, 20, 4, '#c9d6e3') + `<path d="M172 22 V30 M179 22 V30 M186 22 V30" ${st(1.8)}/>` + hand(172, 74, '#ff8a6b')
    + spark(26, 98, .6, '#ffe27a') + spark(184, 112, .5, '#ffe27a'),

  Matchling: () => shadow(100, 141, 30)
    + flame(100, 30, 1.35, '#ff8a2f')
    + limb(94, 112, 86, 134, '#f2d1a0', 6) + limb(106, 112, 114, 134, '#f2d1a0', 6) + E(84, 136, 8, 4.5, '#c98a4a') + E(116, 136, 8, 4.5, '#c98a4a')
    + R(90, 80, 20, 40, 8, '#f6dcae')
    + bend('M92 92 Q78 98 72 96', '#f6dcae', 6)
    + `<g transform="rotate(-10 58 98)">${R(42, 86, 34, 26, 3, '#ffcf4d')}${R(42, 92, 34, 10, 0, '#ff5e57', 0)}<path d="M42 92 H76 M42 102 H76" ${st(2)}/>${flame(59, 99, .32, '#fff')}${R(44, 108, 30, 3, 1, '#8a5634', 0)}</g>` + hand(72, 96, '#f6dcae', 5.5)
    + E(100, 64, 26, 27, '#ff5e57') + E(100, 74, 22, 14, '#e8443e', 0, 'opacity=".35"') + shine(88, 50, 8, 5)
    + face(100, 64, 1.05, 'open')
    + bend('M108 90 Q124 82 130 66', '#f6dcae', 6) + hand(130, 64, '#f6dcae', 5.5)
    + spark(136, 52, .7, '#ffe27a') + spark(146, 66, .45, '#ffe27a') + spark(56, 50, .5, '#ffe27a'),

let AC = null;
function ac() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; } return AC; }

const sfx = {
  tap() { tone(520, .06, .04, 'triangle'); },
  rip() { const a = ac(); if (!a) return; const n = a.createBufferSource(), b = a.createBuffer(1, a.sampleRate * .35, a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) * .5; n.buffer = b; const g = a.createGain(); g.gain.value = .25; const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1200; n.connect(f).connect(g).connect(a.destination); n.start(); },
  flip(r) { tone(380 + RANK[r] * 90, .09, .05, 'triangle'); if (RANK[r] >= 2) [0, .08, .16].forEach((t, i) => tone([660, 880, 1320][i] * (r === 'UR' ? 1.25 : 1), .25, .05, 'sine', t)); if (r === 'UR') [0, .1, .2, .3].forEach((t, i) => tone([784, 988, 1175, 1568][i], .4, .05, 'triangle', .3 + t)); },
  coin() { tone(988, .07, .05, 'square'); tone(1319, .12, .04, 'square', .06); },
  shiny() { [0, .07, .14, .21, .28].forEach((t, i) => tone(1200 + i * 220, .2, .035, 'sine', t)); },
};

// ---------- ui helpers ----------
function toast(icon, text) {

  const box = $('toasts'); box.append(t); while (box.children.length > 3) box.firstChild.remove(); setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 2400);

function setCoins(delta) {

}
function burst(x, y, colors, n = 26) {
  for (let i = 0; i < n; i++) { const b = document.createElement('div'); b.className = 'burst'; const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 140; Object.assign(b.style, { left: x + 'px', top: y + 'px', background: colors[i % colors.length] }); b.style.setProperty('--dx', Math.cos(a) * d + 'px'); b.style.setProperty('--dy', Math.sin(a) * d + 'px'); document.body.append(b); setTimeout(() => b.remove(), 950); }
}
function tiltable(el) {
  const set = (px, py) => { el.style.setProperty('--ry', ((px - .5) * 24).toFixed(1) + 'deg'); el.style.setProperty('--rx', ((.5 - py) * 24).toFixed(1) + 'deg'); el.querySelectorAll('.card').forEach(c => { c.style.setProperty('--fx', (px * 100).toFixed(0) + '%'); c.style.setProperty('--fy', (py * 100).toFixed(0) + '%'); }); };
  el.addEventListener('pointermove', e => { const r = el.getBoundingClientRect(); set((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); });

}
// phones: tilt the foil with the device
let tiltTargets = new Set();
window.addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  const px = Math.min(1, Math.max(0, .5 + e.gamma / 60)), py = Math.min(1, Math.max(0, .5 + (e.beta - 40) / 60));

});

// ---------- opening a pack ----------
function openPack(pack, free = false) {
  ac();
  if (!free) { if (SV.coins < pack.price) return; setCoins(-pack.price); }
  const pulls = rollPack(pack), wasNew = {};
  for (const { c, v } of pulls) {
    if (!total(c.id) && !wasNew[c.id]) wasNew[c.id] = 1;
    own(c.id)[v]++;
    if (v === 'f') SV.stats.foils++; if (v === 's') SV.stats.shinies++;
    if (c.r === 'H') SV.stats.holos++; if (c.r === 'UR') SV.stats.urs++;
  }
  SV.stats.packs++; if (pack.id === 'legend') SV.stats.legend++;
  if (!SV.tipsStarted) { SV.tipsStarted = 1; SV.tips = Date.now(); }
  save();
  const W = Math.min(innerWidth - 48, 280);
  const ov = overlay(`<div class="packstage idle" id="ps">${packSVG(pack, 'pk top')}${packSVG(pack, 'pk body')}</div><div class="hint" id="hint">Tap the pack to rip it open</div>`);
  window.__cs.ov = ov;
  const ps = ov.querySelector('#ps');
  let stage = 'pack', idx = 0, flips = [], busy = false, setT = null;
  ps.onclick = () => {
    if (stage !== 'pack') return; stage = 'tearing'; sfx.rip();
    ps.classList.remove('idle'); ps.classList.add('shake');
    setTimeout(() => { ps.classList.add('torn'); }, 380);
    setTimeout(() => { ps.remove(); dealCards(); }, 1150);
  };
  function dealCards() {
    stage = 'cards';
    const rv = document.createElement('div'); rv.className = 'reveal'; rv.style.width = W + 'px'; rv.style.height = W * 1.4 + 'px';
    rv.innerHTML = `<div class="glow" id="glow"></div>` + pulls.map(({ c, v }, i) => `<div class="flip enter" style="z-index:${pulls.length - i};width:${W}px;height:${W * 1.4}px"><div class="face back">${scaled(backHTML(), W)}</div><div class="face front">${scaled(cardHTML(c, v), W)}${wasNew[c.id] ? '<span class="newb">NEW!</span>' : ''}</div></div>`).join('');
    ov.insertBefore(rv, $('hint') || ov.querySelector('.hint'));
    const tray = document.createElement('div'); tray.className = 'pulled'; ov.append(tray);
    flips = [...rv.querySelectorAll('.flip')];
    setT = tiltable(rv); tiltTargets.add(setT);
    ov.querySelector('.hint').textContent = `Tap to flip · ${pulls.length} cards`;
    rv.onclick = step;
  }
  function step() {
    if (busy || stage !== 'cards') return;
    const f = flips[idx], { c, v } = pulls[idx], glow = ov.querySelector('#glow');
    ov.querySelectorAll('.callout').forEach(n => n.remove());
    if (!f.classList.contains('open')) {
      f.classList.remove('enter'); f.classList.add('open'); sfx.flip(c.r);
      const big = RANK[c.r] >= 2 || v !== 'n';
      if (big) {
        glow.style.background = c.r === 'UR' || v === 's' ? 'conic-gradient(#ff6bd5, #6bd5ff, #ffd56b, #8aff8a, #ff6bd5)' : c.r === 'H' ? 'conic-gradient(#b28cff, #6bd5ff, #ffd56b, #b28cff)' : v === 'f' ? '#a8dcff' : '#ffcf4d';
        glow.classList.add('on');
        const label = v === 's' ? 'SHINY!' : c.r === 'UR' ? 'ULTRA RARE!' : c.r === 'H' ? 'HOLO RARE!' : v === 'f' ? 'FOIL!' : 'RARE!';
        const col = v === 's' ? '#ffe27a' : c.r === 'UR' ? '#ff9ad5' : c.r === 'H' ? '#b6f0ff' : '#ffcf4d';
        setTimeout(() => { const co = document.createElement('div'); co.className = 'callout'; co.textContent = label; co.style.color = col; ov.querySelector('.reveal').append(co); }, 300);
        if (c.r === 'UR' || v === 's') {
          busy = true;
          setTimeout(() => { const fl = document.createElement('div'); fl.className = 'flash'; document.body.append(fl); setTimeout(() => fl.remove(), 650); const r = f.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, ['#ff9ad5', '#8ad8ff', '#ffe27a', '#fff']); if (v === 's') sfx.shiny(); busy = false; }, 350);
          if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
        } else if (navigator.vibrate) navigator.vibrate(20);
      } else glow.classList.remove('on');
      ov.querySelector('.hint').textContent = idx === pulls.length - 1 ? 'Tap to see your haul' : `Tap for the next card · ${pulls.length - idx - 1} left`;
    } else {
      f.classList.add('gone'); glow.classList.remove('on'); sfx.tap();
      const tray = ov.querySelector('.pulled'); tray.insertAdjacentHTML('beforeend', scaled(cardHTML(c, v), 36));
      idx++;
      if (idx >= pulls.length) { setTimeout(summary, 350); stage = 'done'; }
      else ov.querySelector('.hint').textContent = 'Tap to flip';
    }
  }
  function summary() {
    tiltTargets.delete(setT);
    const value = pulls.reduce((s, { c, v }) => s + sellPrice(c, v), 0);
    ov.innerHTML = `<div class="summary"><h3>Your pulls</h3><p class="sub">Worth about ${fmt(value)} coins if you sold them all today.</p>
      <div class="sgrid">${pulls.map(({ c, v }) => `<div>${scaled(cardHTML(c, v), 96)}${wasNew[c.id] ? '<span class="newb" style="font-size:11px">NEW</span>' : ''}<div class="val"><span class="coin" style="width:12px;height:12px"></span>${fmt(sellPrice(c, v))}</div></div>`).join('')}</div>
      <div class="acts"><button class="btn alt" id="sDone">Add to binder</button>${!free || SV.coins >= pack.price ? `<button class="btn" id="sAgain" ${SV.coins >= pack.price ? '' : 'disabled'}>Open another · <span class="coin"></span>${fmt(pack.price)}</button>` : ''}</div></div>`;
    ov.querySelector('#sDone').onclick = () => { ov.remove(); checkGoals(); render(); };
    const again = ov.querySelector('#sAgain'); if (again) again.onclick = () => { ov.remove(); checkGoals(); render(); openPack(pack); };
    checkGoals();
  }
}

// ---------- boot ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { sfx.tap(); show(b.dataset.v); });
setCoins(0); badge(); checkGoals(); show('shop');
setInterval(() => { tick(); save(); if (view === 'market' && !document.querySelector('.ov')) renderMarket(); if (view === 'shop' && !document.querySelector('.ov')) { const b = $('tipBtn'); if (b) { const t = tipsReady(); b.innerHTML = `<span class="coin"></span>+${fmt(t)}`; b.disabled = t < 1; } } }, TICK);
window.__cs = { SV: () => SV, cardHTML, scaled, CARDS, PACKS, openPack, tick, sellPrice, marketPrice, rollPack, show, save, uniqueOwned };
})();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
</body>
